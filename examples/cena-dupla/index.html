<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>cena-dupla</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0d0d0c; }

  .frame {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #0d0d0c;
  }

  /* ── Cena A · title-card (escopo local) ─────────────────────────── */
  .scene-a {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background:
      linear-gradient(90deg, rgba(244, 241, 232, 0.055) 1px, transparent 1px) 96px 0 / 344px 100%,
      #0d0d0c;
    color: #f4f1e8;
    font-family: "Inter", sans-serif;
  }
  .scene-a .masthead {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 74px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font: 400 21px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .scene-a .masthead .dot { display: inline-block; width: 10px; height: 10px; margin-right: 14px; background: #e0452b; }
  .scene-a .headline {
    position: absolute;
    left: 88px;
    font-family: "Anton", sans-serif;
    font-weight: 400;
    font-size: 214px;
    line-height: 0.86;
    letter-spacing: -0.015em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .scene-a .headline.second { color: #e0452b; }
  .scene-a .rule {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 826px;
    height: 1px;
    background: #f4f1e8;
    transform-origin: left center;
    animation: a-rule-in 0.9s cubic-bezier(0.22, 0.8, 0.2, 1) both;
  }
  .scene-a .footer {
    position: absolute;
    left: 96px;
    right: 96px;
    bottom: 78px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font: 400 22px/1.4 "JetBrains Mono", monospace;
    letter-spacing: 0.06em;
  }
  .scene-a .footer .note { max-width: 520px; color: rgba(244, 241, 232, 0.62); text-transform: uppercase; }
  .scene-a .footer .index { font-family: "Anton", sans-serif; font-size: 92px; line-height: 0.8; color: #e0452b; }
  .scene-a .line { animation: a-line-in 0.8s cubic-bezier(0.22, 0.8, 0.2, 1) both; }
  @keyframes a-line-in {
    from { transform: translateY(64px); opacity: 0; clip-path: inset(0 0 100% 0); }
    to { transform: translateY(0); opacity: 1; clip-path: inset(0 0 -10% 0); }
  }
  @keyframes a-rule-in {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }
  @keyframes a-fade-up {
    from { transform: translateY(18px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* ── Cena B · stat-counter (escopo local) ───────────────────────── */
  .scene-b {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #e8e4d9;
    color: #111110;
    font-family: "Space Grotesk", sans-serif;
  }
  .scene-b .ticks {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(17, 17, 16, 0.12) 1px, transparent 1px) 0 0 / 48px 100%;
    mask-image: linear-gradient(180deg, transparent 0%, #000 22%, #000 78%, transparent 100%);
  }
  .scene-b .kicker {
    position: absolute;
    left: 104px;
    top: 88px;
    font: 400 20px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(17, 17, 16, 0.56);
  }
  .scene-b .odometer {
    position: absolute;
    left: 96px;
    top: 268px;
    display: flex;
    align-items: flex-end;
    height: 400px;
    font-family: "Anton", sans-serif;
    font-weight: 400;
    font-size: 400px;
    line-height: 1;
    color: #111110;
  }
  .scene-b .digit {
    position: relative;
    width: 0.62em;
    height: 1em;
    overflow: hidden;
  }
  .scene-b .track { position: absolute; top: 0; left: 0; }
  .scene-b .track span { display: block; height: 1em; line-height: 1; }
  .scene-b .track.eight { animation: b-tick-eight 1.45s steps(8, end) 0.2s both; }
  .scene-b .track.seven { animation: b-tick-seven 1.6s steps(7, end) 0.2s both; }
  .scene-b .percent {
    font-family: "Anton", sans-serif;
    font-size: 176px;
    line-height: 1;
    margin: 0 0 46px 18px;
    color: #d8452e;
  }
  .scene-b .underline {
    position: absolute;
    left: 104px;
    top: 688px;
    width: 980px;
    height: 14px;
    background: #d8452e;
    transform-origin: left center;
    animation: b-draw 0.9s cubic-bezier(0.22, 0.8, 0.2, 1) 1.2s both;
  }
  .scene-b .copy {
    position: absolute;
    left: 1190px;
    top: 330px;
    width: 610px;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 400;
    font-size: 42px;
    line-height: 1.25;
    letter-spacing: -0.015em;
    animation: b-fade-up 0.9s cubic-bezier(0.22, 0.8, 0.2, 1) 0.9s both;
  }
  .scene-b .copy strong { font-weight: 700; }
  .scene-b .footnote {
    position: absolute;
    left: 1190px;
    top: 764px;
    width: 610px;
    border-top: 1px solid rgba(17, 17, 16, 0.45);
    padding-top: 18px;
    font: 400 17px/1.7 "JetBrains Mono", monospace;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(17, 17, 16, 0.6);
  }
  @keyframes b-tick-eight {
    to { transform: translateY(-3200px); }
  }
  @keyframes b-tick-seven {
    to { transform: translateY(-2800px); }
  }
  @keyframes b-draw {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }
  @keyframes b-fade-up {
    from { transform: translateY(26px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* ── Transição · faixa atravessando o quadro [3.7, 4.3) ──────────── */
  .faixa {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: #d8452e;
    animation: faixa-sweep 0.6s cubic-bezier(0.65, 0, 0.35, 1) 3.7s both;
    will-change: clip-path;
  }
  @keyframes faixa-sweep {
    from { clip-path: polygon(-280% 0%, 0% 0%, 10% 100%, -270% 100%); }
    to { clip-path: polygon(100% 0%, 380% 0%, 390% 100%, 110% 100%); }
  }
</style>
</head>
<body>
<div class="frame" data-composition-id="cena-dupla" data-root="true" data-width="1920" data-height="1080" data-fps="30" data-duration="8">

  <!-- Cena A: title-card, janela local [0, 4) -->
  <div class="scene-a" data-composition-id="cena-a" data-start="0" data-duration="4">
    <div class="masthead" data-clip-id="masthead" data-start="0" data-duration="4" style="animation: a-fade-up 0.7s ease-out both">
      <span><span class="dot"></span>FrankFrames / Reel 01</span>
      <span>00:00:00:00</span>
    </div>

    <div class="headline line" data-clip-id="line-one" data-start="0.15" data-duration="3.85" style="top: 286px; animation-delay: 0.15s">Um filme</div>
    <div class="headline second line" data-clip-id="line-two" data-start="0.35" data-duration="3.65" style="top: 470px; animation-delay: 0.35s">é um arquivo.</div>

    <div class="rule" data-clip-id="rule" data-start="0.85" data-duration="3.15"></div>

    <div class="footer" data-clip-id="footer" data-start="1.05" data-duration="2.95" style="animation: a-fade-up 0.8s ease-out 1.05s both">
      <div class="note">Composição determinística<br>1920 × 1080 · 30 fps · 4 s</div>
      <div class="index">01</div>
    </div>
  </div>

  <!-- Cena B: stat-counter, janela local [0, 4) → absoluta [4, 8) -->
  <div class="scene-b" data-composition-id="cena-b" data-start="4" data-duration="4">
    <div class="ticks"></div>
    <div class="kicker" data-clip-id="kicker" data-start="0" data-duration="3.5">Pesquisa interna · 2026</div>

    <div class="odometer" data-clip-id="number" data-start="0.2" data-duration="3.3" aria-label="87 por cento">
      <div class="digit"><div class="track eight"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div></div>
      <div class="digit"><div class="track seven"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div></div>
      <div class="percent">%</div>
    </div>

    <div class="underline" data-clip-id="underline" data-start="1.1" data-duration="2.4"></div>

    <div class="copy" data-clip-id="copy" data-start="0.9" data-duration="2.6">
      das equipes de pós<br><strong>terminam no prazo</strong><br>quando o corte é aprovado antes da trilha.
    </div>

    <div class="footnote" data-clip-id="footnote" data-start="1.2" data-duration="2.3">
      41 produções · 6 países<br>margem de erro 3,2 p.p.
    </div>
  </div>

  <!-- Faixa de transição: atraso absoluto = data-start do clip -->
  <div class="faixa" data-clip-id="faixa" data-start="3.7" data-duration="0.6"></div>

</div>
</body>
</html>
