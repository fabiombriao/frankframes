name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (linux, sem browser)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: contrato, encode, transcrição e catálogo
        run: >
          node --test
          packages/contract/test/contract.test.ts
          packages/encode/test/policy.test.ts
          packages/transcribe/test/openai.test.ts
          packages/transcribe/test/resolve.test.ts
          packages/catalog/test/catalog.test.ts
          packages/producer/test/compile.test.ts
          packages/producer/test/plan.test.ts

  windows:
    name: windows (produto)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: cache ffmpeg e browser pinados
        uses: actions/cache@v4
        with:
          path: |
            vendor/ffmpeg
            vendor/browsers
          key: assets-${{ runner.os }}-n8.1.3-39-g660b5aa7db-chrome-158.0.8127.36

      - run: npm ci

      - name: instalar assets (fontes presentes no repo; ffmpeg e browser no cache)
        run: node packages/cli/src/cli.ts setup

      - name: doctor
        run: node packages/cli/src/cli.ts doctor

      - name: suite completa
        run: npm test

      - name: render de fumaça
        run: node packages/cli/src/cli.ts render examples/hello.html -o out/ci.mp4 --preset draft --workers 2

      - name: conferir o MP4
        shell: pwsh
        run: |
          $info = & vendor/ffmpeg/bin/ffprobe.exe -v error -show_entries stream=codec_name,nb_frames,width,height -of default=nw=1 out/ci.mp4
          $info
          if (-not ($info -match "codec_name=av1")) { throw "codec inesperado" }
          if (-not ($info -match "nb_frames=90")) { throw "frames inesperados" }

      - uses: actions/upload-artifact@v4
        with:
          name: ci-mp4
          path: out/ci.mp4
          retention-days: 7
