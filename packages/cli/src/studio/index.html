<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FrankFrames Studio</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="identity">
      <span class="brand">FrankFrames</span>
      <h1 id="fileName" class="file-name">index.html</h1>
    </div>
    <div class="toolbar" role="toolbar" aria-label="Edição">
      <button id="importButton" type="button" class="tool-button" title="Importar vídeo, áudio ou imagem no playhead (ou arraste o arquivo para a janela)">Importar mídia</button>
      <input id="importInput" type="file" multiple hidden accept="video/*,audio/*,image/*,.mov,.mkv,.m4a,.opus,.flac">
      <button id="splitButton" type="button" class="tool-button" title="Dividir o clip selecionado no playhead (S)" disabled>Dividir</button>
      <button id="undoButton" type="button" class="tool-button" title="Desfazer (Ctrl+Z)" disabled>Desfazer</button>
      <button id="redoButton" type="button" class="tool-button" title="Refazer (Ctrl+Shift+Z ou Ctrl+Y)" disabled>Refazer</button>
    </div>
    <dl class="composition-meta">
      <div>
        <dt>Duração</dt>
        <dd id="totalDuration">--</dd>
      </div>
      <div>
        <dt>FPS</dt>
        <dd id="compositionFps">--</dd>
      </div>
    </dl>
    <p id="connection" class="connection" role="status" aria-live="polite">conectando</p>
  </header>

  <main class="workspace">
    <section class="panel player-panel" aria-label="Player">
      <div id="playerFrame" class="player-frame">
        <iframe id="player" src="/preview" width="1920" height="1080" title="Preview da composição"></iframe>
      </div>
    </section>

    <section class="panel inspector-panel" aria-label="Inspetor do clip">
      <h2>Inspetor</h2>
      <div id="toolDiagnostics" class="diagnostics" role="status" aria-live="polite"></div>
      <div id="compositionDiagnostics" class="diagnostics" role="status" aria-live="polite"></div>
      <p id="inspectorEmpty" class="panel-status">Selecione um clip na timeline.</p>

      <form id="inspector" hidden novalidate>
        <div class="clip-heading">
          <span id="clipTag" class="clip-tag">div</span>
          <code id="clipId" class="clip-id"></code>
        </div>

        <div class="field-grid">
          <label>
            <span>data-start</span>
            <input id="fieldStart" name="data-start" data-field="data-start" type="number" step="0.05" inputmode="decimal" placeholder="vazio">
          </label>
          <label>
            <span>data-duration</span>
            <input id="fieldDuration" name="data-duration" data-field="data-duration" type="number" step="0.05" min="0" inputmode="decimal" placeholder="vazio">
          </label>
          <label>
            <span>data-offset</span>
            <input id="fieldOffset" name="data-offset" data-field="data-offset" type="number" step="0.05" inputmode="decimal" placeholder="vazio">
          </label>
          <label>
            <span>data-volume</span>
            <input id="fieldVolume" name="data-volume" data-field="data-volume" type="number" step="0.01" min="0" inputmode="decimal" placeholder="vazio">
          </label>
          <label>
            <span>data-audio-role</span>
            <select id="fieldRole" name="data-audio-role" data-field="data-audio-role">
              <option value="">(vazio)</option>
              <option value="voice">voice</option>
              <option value="music">music</option>
              <option value="sfx">sfx</option>
            </select>
          </label>
          <label>
            <span>data-playback-rate</span>
            <input id="fieldRate" name="data-playback-rate" data-field="data-playback-rate" type="number" step="0.05" min="0.1" inputmode="decimal" placeholder="vazio">
          </label>
        </div>

        <label class="text-field">
          <span>Texto</span>
          <textarea id="fieldText" name="text" data-field="text" rows="4" spellcheck="false"></textarea>
        </label>

        <p class="field-note">Campos esvaziados são enviados como null. O texto só é enviado quando muda.</p>
        <button id="applyButton" type="submit" class="primary-button" aria-label="Aplicar alterações ao clip selecionado">Aplicar</button>
        <div id="inspectorDiagnostics" class="diagnostics" role="status" aria-live="polite"></div>
      </form>
    </section>

    <aside class="panel blocks-panel" aria-label="Blocos do catálogo">
      <h2>Blocos</h2>
      <p id="blocksStatus" class="panel-status">carregando</p>
      <ul id="blocksList" class="blocks-list"></ul>
      <div id="blocksDiagnostics" class="diagnostics" role="status" aria-live="polite"></div>
    </aside>
  </main>

  <footer class="panel timeline-panel" aria-label="Timeline">
    <div class="timeline-head">
      <div class="timeline-gutter">Timeline</div>
      <div id="ruler" class="ruler" aria-hidden="true"></div>
    </div>
    <div id="timelineBody" class="timeline-body">
      <div id="timelineRows" class="timeline-rows"></div>
      <p id="timelineEmpty" class="panel-status timeline-empty">Nenhum clip na composição.</p>
      <div class="playhead-track" aria-hidden="true">
        <div id="playhead" class="playhead"></div>
      </div>
    </div>
  </footer>

  <div id="dropOverlay" class="drop-overlay" hidden aria-hidden="true">Solte para importar no playhead</div>

  <script type="module" src="/app.js"></script>
</body>
</html>
