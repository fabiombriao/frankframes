<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>vertical-quote</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #14130f; }
  .stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #14130f;
    color: #f4f0e6;
    font-family: "Inter", sans-serif;
  }
  .hairline {
    position: absolute;
    left: 96px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: rgba(244, 240, 230, 0.18);
  }
  .mark {
    position: absolute;
    left: 78px;
    top: 210px;
    font-family: "Playfair Display", serif;
    font-size: 420px;
    line-height: 0.8;
    color: #c8412a;
    opacity: 0.9;
    animation: mark-in 0.7s cubic-bezier(0.22, 0.8, 0.2, 1) both;
  }
  .kicker {
    position: absolute;
    left: 150px;
    top: 122px;
    font: 400 21px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(244, 240, 230, 0.45);
    animation: fade-in 0.6s ease-out both;
  }
  .kicker b { color: #f2e34c; font-weight: 400; margin-right: 14px; }
  .quote {
    position: absolute;
    left: 148px;
    top: 560px;
    width: 830px;
    font-family: "Playfair Display", serif;
    font-weight: 700;
    font-style: italic;
    font-size: 96px;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }
  .quote span { display: block; overflow: hidden; }
  .quote i {
    display: block;
    font-style: inherit;
    animation: line-in 0.9s cubic-bezier(0.22, 0.8, 0.2, 1) both;
  }
  .quote .accent { color: #f2e34c; font-style: normal; }
  .q1 i { animation-delay: 0.15s; }
  .q2 i { animation-delay: 0.26s; }
  .q3 i { animation-delay: 0.37s; }
  .q4 i { animation-delay: 0.48s; }
  .attrib {
    position: absolute;
    left: 148px;
    right: 96px;
    bottom: 300px;
    padding-top: 30px;
    border-top: 1px solid rgba(244, 240, 230, 0.22);
    font: 400 20px/1.7 "JetBrains Mono", monospace;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(244, 240, 230, 0.45);
    animation: fade-in 0.8s ease-out 0.95s both;
  }
  .attrib strong {
    display: block;
    margin-bottom: 8px;
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 34px;
    letter-spacing: -0.01em;
    text-transform: none;
    color: #f4f0e6;
  }
  .foot {
    position: absolute;
    left: 96px;
    right: 96px;
    bottom: 110px;
    display: flex;
    justify-content: space-between;
    font: 400 18px/1.6 "JetBrains Mono", monospace;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(244, 240, 230, 0.32);
    animation: fade-in 0.8s ease-out 1.1s both;
  }
  @keyframes mark-in {
    from { transform: translateY(-30px); opacity: 0; }
    to { transform: translateY(0); opacity: 0.9; }
  }
  @keyframes line-in {
    from { transform: translateY(110%); }
    to { transform: translateY(0); }
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="vertical-quote" data-root="true" data-width="1080" data-height="1920" data-fps="30" data-duration="4.5">
  <div class="hairline"></div>
  <div class="mark">&ldquo;</div>
  <div class="kicker" data-clip-id="kicker" data-start="0" data-duration="4.5"><b>Citação</b>Fita 12</div>

  <blockquote class="quote" data-clip-id="quote" data-start="0.15" data-duration="4.35">
    <span class="q1"><i>“Montar é</i></span>
    <span class="q2"><i>decidir o que</i></span>
    <span class="q3"><i>o público</i></span>
    <span class="q4"><i><em class="accent">não</em> vê.”</i></span>
  </blockquote>

  <div class="attrib" data-clip-id="attribution" data-start="0.95" data-duration="3.55">
    <strong>Nelson Araripe</strong>
    Editor de som · 32 anos de ofício
  </div>

  <div class="foot" data-clip-id="foot" data-start="1.1" data-duration="3.4">
    <span>Estúdio Norte</span>
    <span>Recife, 2026</span>
  </div>
</div>
</body>
</html>
