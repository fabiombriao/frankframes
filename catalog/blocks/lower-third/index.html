<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>lower-third</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #101113; }
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #101113;
    color: #f1efe8;
    font-family: "DM Sans", sans-serif;
  }
  .ghost {
    position: absolute;
    right: -40px;
    top: 40px;
    font-family: "Oswald", sans-serif;
    font-weight: 700;
    font-size: 760px;
    line-height: 0.8;
    color: transparent;
    -webkit-text-stroke: 2px rgba(241, 239, 232, 0.09);
    letter-spacing: -0.04em;
  }
  .frame-line {
    position: absolute;
    left: 96px;
    top: 90px;
    bottom: 90px;
    width: 1px;
    background: rgba(241, 239, 232, 0.22);
  }
  .kicker {
    position: absolute;
    left: 150px;
    top: 96px;
    font: 400 20px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(241, 239, 232, 0.55);
  }
  .band {
    position: absolute;
    left: 0;
    bottom: 178px;
    width: 1180px;
    height: 236px;
    background: #f2e34c;
    transform-origin: left center;
  }
  .name {
    position: absolute;
    left: 150px;
    bottom: 278px;
    font-family: "Oswald", sans-serif;
    font-weight: 700;
    font-size: 104px;
    line-height: 1;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: #101113;
  }
  .role {
    position: absolute;
    left: 154px;
    bottom: 220px;
    font-family: "DM Sans", sans-serif;
    font-weight: 400;
    font-size: 31px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #101113;
  }
  .marker {
    position: absolute;
    left: 96px;
    bottom: 178px;
    width: 18px;
    height: 236px;
    background: #e0452b;
    transform-origin: bottom center;
  }
  .meta {
    position: absolute;
    right: 96px;
    bottom: 214px;
    text-align: right;
    font: 400 19px/1.8 "JetBrains Mono", monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(241, 239, 232, 0.52);
  }
  .meta strong { display: block; color: #f1efe8; font-weight: 400; font-size: 24px; letter-spacing: 0.02em; }
</style>
</head>
<body>
<div class="stage" data-composition-id="lower-third" data-root="true" data-width="1920" data-height="1080" data-fps="30" data-duration="3">
  <div class="ghost">02</div>
  <div class="frame-line"></div>

  <div class="kicker" data-clip-id="kicker" data-start="0" data-duration="3" data-enter="surgir dur=0.6 curve=ease-out">Perfil / Entrevista</div>

  <div class="band" data-clip-id="band" data-start="0.1" data-duration="2.9" data-keyframes='[{"time":0,"scaleX":0.43167,"curve":"cubic-bezier(0.14815,0.78147,0.28552,1)"},{"time":0.75,"scaleX":1}]'></div>
  <div class="marker" data-clip-id="marker" data-start="0.1" data-duration="2.9" data-keyframes='[{"time":0,"scaleY":0.58207,"curve":"cubic-bezier(0.14334,0.77175,0.33701,1)"},{"time":0.5,"scaleY":1}]'></div>

  <div class="name" data-clip-id="name" data-start="0.25" data-duration="2.75" data-enter="chegar-esquerda distance=48 dur=0.8 at=-0.07 curve=cubic-bezier(0.22,0.8,0.2,1)">Helena Vasques</div>
  <div class="role" data-clip-id="role" data-start="0.45" data-duration="2.55" data-enter="chegar-esquerda distance=48 dur=0.8 at=-0.11 curve=cubic-bezier(0.22,0.8,0.2,1)">Diretora de fotografia</div>

  <div class="meta" data-clip-id="meta" data-start="0.62" data-duration="2.38" data-enter="surgir dur=0.9 at=-0.12 curve=ease-out">
    <strong>01 — 04</strong>
    Série documental<br>
    Salvador, BA
  </div>
</div>
</body>
</html>
