<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>lower-third</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #101113; }
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #101113;
    color: #f1efe8;
    font-family: "DM Sans", sans-serif;
  }
  .ghost {
    position: absolute;
    right: -40px;
    top: 40px;
    font-family: "Oswald", sans-serif;
    font-weight: 700;
    font-size: 760px;
    line-height: 0.8;
    color: transparent;
    -webkit-text-stroke: 2px rgba(241, 239, 232, 0.09);
    letter-spacing: -0.04em;
  }
  .frame-line {
    position: absolute;
    left: 96px;
    top: 90px;
    bottom: 90px;
    width: 1px;
    background: rgba(241, 239, 232, 0.22);
  }
  .kicker {
    position: absolute;
    left: 150px;
    top: 96px;
    font: 400 20px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(241, 239, 232, 0.55);
  }
  .band {
    position: absolute;
    left: 0;
    bottom: 178px;
    width: 1180px;
    height: 236px;
    background: #f2e34c;
    transform-origin: left center;
    animation: band-in 0.85s cubic-bezier(0.22, 0.8, 0.2, 1) both;
  }
  .name {
    position: absolute;
    left: 150px;
    bottom: 278px;
    font-family: "Oswald", sans-serif;
    font-weight: 700;
    font-size: 104px;
    line-height: 1;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: #101113;
    animation: slide-in 0.8s cubic-bezier(0.22, 0.8, 0.2, 1) 0.18s both;
  }
  .role {
    position: absolute;
    left: 154px;
    bottom: 220px;
    font-family: "DM Sans", sans-serif;
    font-weight: 400;
    font-size: 31px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #101113;
    animation: slide-in 0.8s cubic-bezier(0.22, 0.8, 0.2, 1) 0.34s both;
  }
  .marker {
    position: absolute;
    left: 96px;
    bottom: 178px;
    width: 18px;
    height: 236px;
    background: #e0452b;
    transform-origin: bottom center;
    animation: marker-in 0.6s cubic-bezier(0.22, 0.8, 0.2, 1) both;
  }
  .meta {
    position: absolute;
    right: 96px;
    bottom: 214px;
    text-align: right;
    font: 400 19px/1.8 "JetBrains Mono", monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(241, 239, 232, 0.52);
    animation: fade-in 0.9s ease-out 0.5s both;
  }
  .meta strong { display: block; color: #f1efe8; font-weight: 400; font-size: 24px; letter-spacing: 0.02em; }
  @keyframes band-in {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }
  @keyframes marker-in {
    from { transform: scaleY(0); }
    to { transform: scaleY(1); }
  }
  @keyframes slide-in {
    from { transform: translateX(-48px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="lower-third" data-root="true" data-width="1920" data-height="1080" data-fps="30" data-duration="3">
  <div class="ghost">02</div>
  <div class="frame-line"></div>

  <div class="kicker" data-clip-id="kicker" data-start="0" data-duration="3" style="animation: fade-in 0.6s ease-out both">Perfil / Entrevista</div>

  <div class="band" data-clip-id="band" data-start="0.1" data-duration="2.9"></div>
  <div class="marker" data-clip-id="marker" data-start="0.1" data-duration="2.9"></div>

  <div class="name" data-clip-id="name" data-start="0.25" data-duration="2.75">Helena Vasques</div>
  <div class="role" data-clip-id="role" data-start="0.45" data-duration="2.55">Diretora de fotografia</div>

  <div class="meta" data-clip-id="meta" data-start="0.62" data-duration="2.38">
    <strong>01 — 04</strong>
    Série documental<br>
    Salvador, BA
  </div>
</div>
</body>
</html>
