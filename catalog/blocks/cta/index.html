<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>cta</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f7f3e8; }
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #f7f3e8;
    color: #14130f;
    font-family: "Inter", sans-serif;
  }
  .bar {
    position: absolute;
    left: 0;
    top: 0;
    width: 18px;
    height: 1080px;
    background: #c8412a;
  }
  .kicker {
    position: absolute;
    left: 132px;
    top: 104px;
    font: 400 20px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: rgba(20, 19, 15, 0.55);
    animation: fade-in 0.7s ease-out both;
  }
  .kicker b { color: #c8412a; font-weight: 400; margin-right: 14px; }
  .headline {
    position: absolute;
    left: 128px;
    top: 210px;
    width: 1480px;
    font-size: 138px;
    font-weight: 700;
    line-height: 0.98;
    letter-spacing: -0.045em;
  }
  .headline em {
    font-family: "Playfair Display", serif;
    font-style: italic;
    font-weight: 700;
    color: #c8412a;
  }
  .headline span { display: block; animation: rise-in 0.9s cubic-bezier(0.22, 0.85, 0.24, 1) both; }
  .headline span + span { animation-delay: 0.12s; }
  .support {
    position: absolute;
    left: 132px;
    top: 596px;
    font: 400 23px/1.5 "JetBrains Mono", monospace;
    letter-spacing: 0.04em;
    color: rgba(20, 19, 15, 0.65);
    animation: fade-in 0.7s ease-out 0.5s both;
  }
  .btn {
    position: absolute;
    left: 132px;
    top: 736px;
    width: 540px;
    height: 126px;
    border: 2px solid #14130f;
    overflow: hidden;
    animation: btn-in 0.7s cubic-bezier(0.22, 0.85, 0.24, 1) 0.55s both;
  }
  .btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: #14130f;
    transform-origin: left center;
    animation: fill 0.75s cubic-bezier(0.4, 0.1, 0.2, 1) 1s both;
  }
  .btn .label {
    position: absolute;
    left: 34px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.01em;
    animation: label-flip 0.5s ease-out 1.35s both;
  }
  .btn .arrow {
    position: absolute;
    right: 34px;
    top: 50%;
    width: 46px;
    height: 2px;
    background: currentColor;
    transform: translateY(-50%);
    animation: arrow-in 0.5s cubic-bezier(0.22, 0.85, 0.24, 1) 1.5s both, label-flip 0.5s ease-out 1.35s both;
  }
  .btn .arrow::after {
    content: "";
    position: absolute;
    right: 0;
    top: -11px;
    width: 22px;
    height: 22px;
    border-top: 2px solid currentColor;
    border-right: 2px solid currentColor;
    transform: rotate(45deg);
  }
  .fine {
    position: absolute;
    left: 132px;
    top: 902px;
    font: 400 17px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(20, 19, 15, 0.45);
    animation: fade-in 0.7s ease-out 1.7s both;
  }
  .seal {
    position: absolute;
    right: 132px;
    top: 736px;
    width: 320px;
    text-align: right;
    font: 400 18px/1.7 "JetBrains Mono", monospace;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(20, 19, 15, 0.5);
    animation: fade-in 0.8s ease-out 1.1s both;
  }
  .seal strong {
    display: block;
    font-family: "Inter", sans-serif;
    font-size: 64px;
    font-weight: 700;
    letter-spacing: -0.04em;
    color: #14130f;
    line-height: 1;
    margin-bottom: 8px;
  }
  @keyframes rise-in {
    from { opacity: 0; transform: translateY(46px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes btn-in {
    from { opacity: 0; transform: translateY(28px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fill {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }
  @keyframes label-flip {
    from { color: #14130f; }
    to { color: #f7f3e8; }
  }
  @keyframes arrow-in {
    from { margin-left: -22px; }
    to { margin-left: 0; }
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="cta" data-root="true" data-width="1920" data-height="1080" data-fps="30" data-duration="3.6">
  <div class="bar" data-clip-id="cta-bar" data-start="0" data-duration="3.6"></div>
  <div class="kicker" data-clip-id="cta-kicker" data-start="0" data-duration="3.6"><b>02</b>Temporada nova</div>

  <div class="headline" data-clip-id="cta-headline" data-start="0.1" data-duration="3.5">
    <span>Assine a</span>
    <span><em>temporada</em> inteira.</span>
  </div>

  <div class="support" data-clip-id="cta-support" data-start="0.45" data-duration="3.15">
    12 episódios · toda quinta · sem intervalo
  </div>

  <div class="btn" data-clip-id="cta-button" data-start="0.55" data-duration="3.05">
    <div class="label">Quero assistir</div>
    <div class="arrow"></div>
  </div>

  <div class="fine" data-clip-id="cta-fine" data-start="1.1" data-duration="2.5">Cancele quando quiser</div>

  <div class="seal" data-clip-id="cta-seal" data-start="0.9" data-duration="2.7">
    <strong>R$ 19</strong>
    por mês<br>no plano anual
  </div>
</div>
</body>
</html>
