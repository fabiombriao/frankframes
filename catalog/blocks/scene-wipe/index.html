<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>scene-wipe</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #14130f; }
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #14130f;
    font-family: "Inter", sans-serif;
  }
  .layer { position: absolute; inset: 0; }
  .old {
    background: #14130f;
    color: #f2efe6;
  }
  .new {
    background: #e9e3d3;
    color: #15130f;
  }
  .kicker {
    position: absolute;
    left: 104px;
    top: 96px;
    font: 400 20px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.24em;
    text-transform: uppercase;
  }
  .old .kicker { color: rgba(242, 239, 230, 0.66); }
  .new .kicker { color: rgba(21, 19, 15, 0.78); }
  .headline {
    position: absolute;
    left: 100px;
    bottom: 148px;
    font-family: "Anton", sans-serif;
    font-size: 208px;
    line-height: 0.9;
    letter-spacing: 0.005em;
    text-transform: uppercase;
  }
  .headline span { display: block; }
  .old .headline { color: #f2efe6; opacity: 0.32; }
  .new .headline { color: #15130f; }
  .note {
    position: absolute;
    left: 104px;
    top: 172px;
    width: 560px;
    font: 400 22px/1.6 "Inter", sans-serif;
    color: rgba(21, 19, 15, 0.82);
  }
  .rule {
    position: absolute;
    right: 104px;
    top: 96px;
    width: 220px;
    height: 4px;
    background: #15130f;
  }
  .band {
    position: absolute;
    top: 0;
    bottom: 0;
    left: -440px;
    width: 440px;
    background: #d8452e;
    z-index: 5;
  }
  .band::after {
    content: "";
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 10px;
    background: #14130f;
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="scene-wipe" data-root="true" data-width="1920" data-height="1080" data-fps="30" data-duration="4">
  <div class="layer old" data-clip-id="scene-old" data-start="0" data-duration="4">
    <div class="kicker">Cena 01 / sala</div>
    <div class="headline"><span>Seis</span><span>da manhã</span></div>
  </div>

  <div class="layer new" data-clip-id="scene-new" data-start="0.2" data-duration="3.8" data-keyframes='[{"time":0,"clip":"inset(0% 100% 0% 0%)","curve":"cubic-bezier(0.72,0,0.18,1)"},{"time":0.6,"clip":"inset(0% 0% 0% 0%)"}]'>
    <div class="kicker" data-enter="subir distance=26 dur=0.55 at=0.7 curve=ease-out">Cena 02 / rua</div>
    <div class="rule" data-enter="subir distance=26 dur=0.5 at=0.66 curve=ease-out"></div>
    <div class="note" data-enter="subir distance=26 dur=0.6 at=0.8 curve=ease-out">A mesma hora, outra cidade. O corte troca o lugar sem mover o relógio.</div>
    <div class="headline"><span data-enter="subir distance=26 dur=0.7 at=0.62 curve=ease-out">Sete</span><span data-enter="subir distance=26 dur=0.7 at=0.7 curve=ease-out">da manhã</span></div>
  </div>

  <div class="band" data-clip-id="wipe-band" data-start="0.2" data-duration="0.6" data-keyframes='[{"time":0,"x":0,"curve":"cubic-bezier(0.72,0,0.18,1)"},{"time":0.6,"x":2360}]'></div>
</div>
</body>
</html>
