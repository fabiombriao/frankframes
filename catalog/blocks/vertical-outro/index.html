<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>vertical-outro</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f4f0e6; }
  .stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #f4f0e6;
    color: #14130f;
    font-family: "Inter", sans-serif;
  }
  .frame {
    position: absolute;
    left: 60px;
    right: 60px;
    top: 60px;
    bottom: 60px;
    border: 1px solid rgba(20, 19, 15, 0.18);
  }
  .kicker {
    position: absolute;
    left: 96px;
    top: 130px;
    font: 400 21px/1.7 "JetBrains Mono", monospace;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(20, 19, 15, 0.5);
  }
  .kicker b { display: block; color: #c8412a; font-weight: 400; }
  .mark {
    position: absolute;
    left: 96px;
    top: 262px;
    width: 88px;
    height: 88px;
    border: 3px solid #14130f;
  }
  .mark .stem {
    position: absolute;
    left: 20px;
    top: 18px;
    width: 10px;
    height: 50px;
    background: #14130f;
    transform-origin: top center;
  }
  .mark .arm {
    position: absolute;
    left: 20px;
    top: 18px;
    width: 40px;
    height: 10px;
    background: #14130f;
    transform-origin: left center;
  }
  .mark .dot {
    position: absolute;
    right: 12px;
    bottom: 12px;
    width: 12px;
    height: 12px;
    background: #c8412a;
  }
  .title {
    position: absolute;
    left: 96px;
    top: 640px;
    width: 900px;
    font-family: "Playfair Display", serif;
    font-weight: 700;
    font-size: 158px;
    line-height: 1.02;
    letter-spacing: -0.035em;
  }
  .title span { display: block; overflow: hidden; }
  .title i {
    display: block;
    font-style: normal;
  }
  .title .l2 i { font-style: italic; color: #c8412a; }
  .rule {
    position: absolute;
    left: 96px;
    top: 1060px;
    width: 300px;
    height: 4px;
    background: #14130f;
    transform-origin: left center;
  }
  .signature {
    position: absolute;
    left: 96px;
    top: 1110px;
    font-family: "Great Vibes", cursive;
    font-size: 92px;
    line-height: 1.1;
    color: #14130f;
  }
  .next {
    position: absolute;
    left: 96px;
    top: 1290px;
    width: 760px;
    font-size: 32px;
    line-height: 1.5;
    color: rgba(20, 19, 15, 0.62);
  }
  .next strong { color: #14130f; }
  .foot {
    position: absolute;
    left: 96px;
    right: 96px;
    bottom: 130px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-top: 26px;
    border-top: 1px solid rgba(20, 19, 15, 0.24);
    font: 400 19px/1.7 "JetBrains Mono", monospace;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(20, 19, 15, 0.45);
  }
  .foot strong { display: block; font-family: "Inter", sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 0; text-transform: none; color: #14130f; }
  .foot .right { text-align: right; }
</style>
</head>
<body>
<div class="stage" data-composition-id="vertical-outro" data-root="true" data-width="1080" data-height="1920" data-fps="30" data-duration="3">
  <div class="frame"></div>

  <div class="kicker" data-clip-id="kicker" data-start="0" data-duration="3" data-enter="subir distance=10 dur=0.6 curve=ease-out"><b>Fim do capítulo</b>Série Ofício · 04</div>

  <div class="mark" data-clip-id="mark" data-start="0.1" data-duration="2.9" data-keyframes='[{"time":0,"scale":0.8,"opacity":0,"curve":"cubic-bezier(0.22,0.8,0.2,1)"},{"time":0.6,"scale":1,"opacity":1}]'>
    <div class="stem" data-keyframes='[{"time":0.2,"scaleY":0,"curve":"cubic-bezier(0.22,0.8,0.2,1)"},{"time":0.7,"scaleY":1}]'></div>
    <div class="arm" data-keyframes='[{"time":0.32,"scaleX":0,"curve":"cubic-bezier(0.22,0.8,0.2,1)"},{"time":0.77,"scaleX":1}]'></div>
    <div class="dot" data-keyframes='[{"time":0.45,"scale":0,"curve":"cubic-bezier(0.22,1.5,0.4,1)"},{"time":0.8,"scale":1}]'></div>
  </div>

  <h1 class="title" data-clip-id="title" data-start="0.15" data-duration="2.85">
    <span class="l1"><i data-keyframes='[{"time":0,"y":72.74133,"curve":"cubic-bezier(0.14334,0.77175,0.33701,1)"},{"time":0.75,"y":0}]'>Até a</i></span>
    <span class="l2"><i data-keyframes='[{"time":0,"y":152.64146,"curve":"cubic-bezier(0.19331,0.79564,0.21658,1)"},{"time":0.87,"y":0}]'>próxima.</i></span>
  </h1>

  <div class="rule" data-clip-id="rule" data-start="0.5" data-duration="2.5" data-keyframes='[{"time":0,"scaleX":0,"curve":"cubic-bezier(0.22,0.8,0.2,1)"},{"time":0.7,"scaleX":1}]'></div>
  <div class="signature" data-clip-id="signature" data-start="0.62" data-duration="2.38" data-enter="subir distance=10 dur=0.8 curve=ease-out">Mara &amp; João</div>

  <p class="next" data-clip-id="next" data-start="0.8" data-duration="2.2" data-enter="subir distance=10 dur=0.8 curve=ease-out">
    <strong>Episódio 05 — A ilha que some.</strong><br>
    Estreia na quinta, às 21h.
  </p>

  <div class="foot" data-clip-id="foot" data-start="1" data-duration="2" data-enter="subir distance=10 dur=0.8 curve=ease-out">
    <div><strong>@frankframes</strong>frankframes.studio</div>
    <div class="right"><strong>Porto Alegre</strong>2026</div>
  </div>
</div>
</body>
</html>
