<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>vertical-image</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #efece3; }
  .stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #efece3;
    color: #14130f;
    font-family: "Inter", sans-serif;
  }
  .kicker {
    position: absolute;
    left: 96px;
    top: 108px;
    font: 400 21px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(20, 19, 15, 0.5);
    animation: fade-in 0.6s ease-out both;
  }
  .kicker b { color: #c8412a; font-weight: 400; margin-right: 14px; }
  .count {
    position: absolute;
    right: 96px;
    top: 96px;
    font-family: "Bebas Neue", sans-serif;
    font-size: 86px;
    line-height: 1;
    color: rgba(20, 19, 15, 0.22);
    animation: fade-in 0.6s ease-out 0.1s both;
  }
  .photo {
    position: absolute;
    left: 96px;
    top: 240px;
    width: 888px;
    height: 1040px;
    overflow: hidden;
    background: #e2dccb;
    animation: photo-in 0.85s cubic-bezier(0.22, 0.8, 0.2, 1) 0.1s both;
  }
  .sun {
    position: absolute;
    left: 286px;
    top: 190px;
    width: 230px;
    height: 230px;
    border-radius: 50%;
    background: #f2e34c;
    animation: sun-in 0.95s cubic-bezier(0.22, 0.8, 0.2, 1) 0.25s both;
  }
  .ridge-back {
    position: absolute;
    left: -60px;
    bottom: 250px;
    width: 1010px;
    height: 420px;
    background: #bcb5a4;
    clip-path: polygon(0 100%, 14% 46%, 27% 72%, 44% 26%, 61% 64%, 78% 40%, 100% 100%);
    animation: ridge-in 0.9s cubic-bezier(0.22, 0.8, 0.2, 1) 0.3s both;
  }
  .ridge-front {
    position: absolute;
    left: -40px;
    bottom: 210px;
    width: 980px;
    height: 360px;
    background: #8b8577;
    clip-path: polygon(0 100%, 12% 58%, 30% 84%, 48% 44%, 68% 76%, 84% 50%, 100% 100%);
    animation: ridge-in 0.9s cubic-bezier(0.22, 0.8, 0.2, 1) 0.42s both;
  }
  .ground {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 230px;
    background: #35332c;
    transform-origin: bottom center;
    animation: ground-in 0.8s cubic-bezier(0.22, 0.8, 0.2, 1) 0.5s both;
  }
  .ground i {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 3px;
    background: #c8412a;
    font-style: normal;
  }
  .stamp {
    position: absolute;
    left: 34px;
    bottom: 28px;
    font: 400 18px/1.5 "JetBrains Mono", monospace;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(244, 240, 230, 0.7);
    animation: fade-in 0.7s ease-out 0.8s both;
  }
  .frame-label {
    position: absolute;
    right: 30px;
    top: 30px;
    padding: 8px 12px;
    background: rgba(20, 19, 15, 0.72);
    font: 400 15px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #f4f0e6;
    animation: fade-in 0.7s ease-out 0.9s both;
  }
  .caption {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 1320px;
    animation: rise-in 0.8s cubic-bezier(0.22, 0.8, 0.2, 1) 0.9s both;
  }
  .caption h1 {
    margin: 0;
    font-size: 52px;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -0.03em;
  }
  .caption p {
    margin: 16px 0 0;
    width: 760px;
    font-size: 27px;
    line-height: 1.5;
    color: rgba(20, 19, 15, 0.58);
  }
  .meta {
    position: absolute;
    left: 96px;
    right: 96px;
    bottom: 124px;
    display: flex;
    justify-content: space-between;
    padding-top: 24px;
    border-top: 1px solid rgba(20, 19, 15, 0.24);
    font: 400 18px/1.7 "JetBrains Mono", monospace;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(20, 19, 15, 0.45);
    animation: fade-in 0.75s ease-out 1.05s both;
  }
  .meta b { font-weight: 400; color: #14130f; }
  .meta .right { text-align: right; }
  @keyframes photo-in {
    from { clip-path: inset(0 100% 0 0); }
    to { clip-path: inset(0 0 0 0); }
  }
  @keyframes sun-in {
    from { transform: translateY(90px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes ridge-in {
    from { transform: translateY(48px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes ground-in {
    from { transform: scaleY(0); }
    to { transform: scaleY(1); }
  }
  @keyframes rise-in {
    from { transform: translateY(24px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="vertical-image" data-root="true" data-width="1080" data-height="1920" data-fps="30" data-duration="3.5">
  <div class="kicker" data-clip-id="kicker" data-start="0" data-duration="3.5"><b>Arquivo</b>Paisagem</div>
  <div class="count" data-clip-id="count" data-start="0.1" data-duration="3.4">01</div>

  <div class="photo" data-clip-id="photo" data-start="0.1" data-duration="3.4">
    <div class="sun"></div>
    <div class="ridge-back"></div>
    <div class="ridge-front"></div>
    <div class="ground"><i></i></div>
    <div class="stamp">Quadro 018 · 06h12</div>
    <div class="frame-label">35 mm · f/2.8</div>
  </div>

  <div class="caption" data-clip-id="caption" data-start="0.9" data-duration="2.6">
    <h1>Serra do Mar, antes do primeiro ônibus</h1>
    <p>A luz dura quatro minutos. Depois disso a névoa sobe e o vale vira uma parede branca.</p>
  </div>

  <div class="meta" data-clip-id="meta" data-start="1.05" data-duration="2.45">
    <div>Fotografia <b>Helena Vasques</b></div>
    <div class="right">Fig. 01 — <b>2026</b></div>
  </div>
</div>
</body>
</html>
