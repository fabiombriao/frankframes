<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>vertical-stat</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f6f3ea; }
  .stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #f6f3ea;
    color: #14130f;
    font-family: "Inter", sans-serif;
  }
  .top {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 110px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font: 400 21px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(20, 19, 15, 0.5);
  }
  .top b { color: #c8412a; font-weight: 400; }
  .rule {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 180px;
    height: 2px;
    background: #14130f;
    transform-origin: left center;
  }
  .figure {
    position: absolute;
    left: 96px;
    top: 460px;
    font-family: "Bebas Neue", sans-serif;
    font-size: 560px;
    line-height: 0.82;
    letter-spacing: -0.01em;
    color: #c8412a;
    animation: figure-in 0.85s cubic-bezier(0.22, 0.8, 0.2, 1) 0.12s both;
  }
  .figure small {
    font-family: "Bebas Neue", sans-serif;
    font-size: 280px;
    color: #14130f;
  }
  .claim {
    position: absolute;
    left: 96px;
    top: 1010px;
    width: 880px;
    font-size: 62px;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.035em;
  }
  .claim span { color: rgba(20, 19, 15, 0.6); }
  .meter {
    position: absolute;
    left: 96px;
    top: 1300px;
    width: 888px;
  }
  .track {
    position: relative;
    width: 100%;
    height: 22px;
    background: rgba(20, 19, 15, 0.12);
    animation: fade-in 0.5s ease-out 0.55s both;
  }
  .fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    background: #14130f;
    transform-origin: left center;
  }
  .fill::after {
    content: "";
    position: absolute;
    right: 0;
    top: -8px;
    width: 3px;
    height: 38px;
    background: #c8412a;
  }
  .scale {
    position: relative;
    margin-top: 16px;
    display: flex;
    justify-content: space-between;
    font: 400 18px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.12em;
    color: rgba(20, 19, 15, 0.4);
  }
  .note {
    position: absolute;
    left: 96px;
    right: 96px;
    bottom: 190px;
    border-top: 1px solid rgba(20, 19, 15, 0.24);
    padding-top: 26px;
    display: flex;
    justify-content: space-between;
    font: 400 19px/1.7 "JetBrains Mono", monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(20, 19, 15, 0.45);
  }
  .note strong { display: block; font-family: "Inter", sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 0; text-transform: none; color: #14130f; }
  .note .right { text-align: right; }
  @keyframes figure-in {
    from { transform: translateY(60px); opacity: 0; clip-path: inset(0 0 100% 0); }
    to { transform: translateY(0); opacity: 1; clip-path: inset(0 0 -8% 0); }
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="vertical-stat" data-root="true" data-width="1080" data-height="1920" data-fps="30" data-duration="4">
  <div class="top" data-clip-id="top" data-start="0" data-duration="4" data-enter="subir distance=10 dur=0.6 curve=ease-out"><span>Hábitos de tela</span><b>2026</b></div>
  <div class="rule" data-clip-id="rule" data-start="0" data-duration="4" data-keyframes='[{"time":0,"scaleX":0,"curve":"cubic-bezier(0.22,0.8,0.2,1)"},{"time":0.8,"scaleX":1}]'></div>

  <div class="figure" data-clip-id="figure" data-start="0.12" data-duration="3.88">78<small>%</small></div>

  <h1 class="claim" data-clip-id="claim" data-start="0.4" data-duration="3.6" data-enter="subir distance=26 dur=0.8 curve=cubic-bezier(0.22,0.8,0.2,1)">
    assistem a vídeos <span>na vertical</span>, com o som desligado.
  </h1>

  <div class="meter" data-clip-id="meter" data-start="0.55" data-duration="3.45" data-enter="subir distance=10 dur=0.5 curve=ease-out">
    <div class="track"><div class="fill" style="width: 78%" data-keyframes='[{"time":0.15,"scaleX":0,"curve":"cubic-bezier(0.22,0.8,0.2,1)"},{"time":1.05,"scaleX":1}]'></div></div>
    <div class="scale" data-enter="subir distance=10 dur=0.6 at=0.25 curve=ease-out"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>
  </div>

  <div class="note" data-clip-id="note" data-start="1" data-duration="3" data-enter="subir distance=10 dur=0.8 curve=ease-out">
    <div><strong>Amostra de 2.400 pessoas</strong>Pesquisa anual · mobile</div>
    <div class="right"><strong>Margem 2,1 p.p.</strong>Fonte: FrankFrames Lab</div>
  </div>
</div>
</body>
</html>
