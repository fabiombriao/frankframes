<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>vertical-gallery</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #efece3; }
  .stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #efece3;
    color: #14130f;
    font-family: "Inter", sans-serif;
  }
  .kicker {
    position: absolute;
    left: 96px;
    top: 104px;
    font: 400 21px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: rgba(20, 19, 15, 0.5);
    animation: fade-in 0.6s ease-out both;
  }
  .kicker b { color: #c8412a; font-weight: 400; margin-right: 12px; }
  .title {
    position: absolute;
    left: 92px;
    top: 176px;
    width: 800px;
    font-size: 92px;
    font-weight: 700;
    line-height: 0.98;
    letter-spacing: -0.05em;
    animation: rise 0.8s cubic-bezier(0.22, 0.85, 0.24, 1) 0.08s both;
  }
  .title em {
    font-family: "Playfair Display", serif;
    font-style: italic;
    color: #c8412a;
  }
  .frame {
    position: absolute;
    left: 96px;
    width: 780px;
    height: 424px;
    overflow: hidden;
    animation: unroll 0.9s cubic-bezier(0.3, 0.9, 0.24, 1) both;
  }
  .frame .fill { position: absolute; inset: 0; }
  .frame .hair {
    position: absolute;
    inset: 16px;
    border: 1px solid rgba(239, 236, 227, 0.35);
  }
  .frame .cap {
    position: absolute;
    left: 24px;
    bottom: 20px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    font: 400 18px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .frame .cap b { font-weight: 400; font-size: 26px; }
  .f1 { top: 388px; }
  .f2 { top: 848px; }
  .f3 { top: 1308px; }
  .f1 .fill { background: #cbc5b4; }
  .f2 .fill { background: #2b2a25; }
  .f3 .fill { background: #c8412a; }
  .f1 .cap { color: #14130f; }
  .f2 .cap, .f3 .cap { color: #f5efe0; }
  .f2 .hair { border-color: rgba(245, 239, 224, 0.22); }
  .f1 .fill::after,
  .f2 .fill::after,
  .f3 .fill::after {
    content: "";
    position: absolute;
    right: 34px;
    top: 34px;
    width: 120px;
    height: 120px;
    border: 1px solid currentColor;
    border-radius: 50%;
  }
  .f1 .fill::after { color: rgba(20, 19, 15, 0.25); }
  .f2 .fill::after, .f3 .fill::after { color: rgba(245, 239, 224, 0.3); }
  .side {
    position: absolute;
    right: 26px;
    top: 388px;
    writing-mode: vertical-rl;
    font: 400 17px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(20, 19, 15, 0.4);
    animation: fade-in 0.7s ease-out 0.6s both;
  }
  .foot {
    position: absolute;
    left: 96px;
    right: 96px;
    bottom: 104px;
    display: flex;
    justify-content: space-between;
    border-top: 1px solid rgba(20, 19, 15, 0.28);
    padding-top: 22px;
    font: 400 18px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(20, 19, 15, 0.55);
    animation: fade-in 0.8s ease-out 1.2s both;
  }
  @keyframes unroll {
    from { opacity: 0; transform: translateY(48px) rotate(-0.7deg); clip-path: inset(0 0 100% 0); }
    to { opacity: 1; transform: translateY(0) rotate(0deg); clip-path: inset(0 0 0 0); }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="vertical-gallery" data-root="true" data-width="1080" data-height="1920" data-fps="30" data-duration="3.8">
  <div class="kicker" data-clip-id="gallery-kicker" data-start="0" data-duration="3.8"><b>01</b>Série Costa</div>
  <div class="title" data-clip-id="gallery-title" data-start="0.08" data-duration="3.72">Três lugares,<br><em>um rolo</em></div>

  <div class="frame f1" data-clip-id="gallery-frame-1" data-start="0.05" data-duration="3.75">
    <div class="fill"></div>
    <div class="hair"></div>
    <div class="cap"><b>01</b>Litoral · 06h</div>
  </div>

  <div class="frame f2" data-clip-id="gallery-frame-2" data-start="0.3" data-duration="3.5">
    <div class="fill"></div>
    <div class="hair"></div>
    <div class="cap"><b>02</b>Serra · 11h</div>
  </div>

  <div class="frame f3" data-clip-id="gallery-frame-3" data-start="0.55" data-duration="3.25">
    <div class="fill"></div>
    <div class="hair"></div>
    <div class="cap"><b>03</b>Cidade · 18h</div>
  </div>

  <div class="side" data-clip-id="gallery-side" data-start="0.6" data-duration="3.2">Arquivo 2026</div>

  <div class="foot" data-clip-id="gallery-foot" data-start="1.1" data-duration="2.7">
    <span>Contato · 35 mm</span>
    <span>03 / 03</span>
  </div>
</div>
</body>
</html>
