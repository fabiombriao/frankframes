<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>vertical-credits</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #101113; }
  .stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #101113;
    color: #f2efe6;
    font-family: "Inter", sans-serif;
  }
  .kicker {
    position: absolute;
    left: 96px;
    top: 120px;
    font: 400 20px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(242, 239, 230, 0.62);
  }
  .title {
    position: absolute;
    left: 92px;
    top: 164px;
    width: 800px;
    font-family: "Playfair Display", serif;
    font-weight: 700;
    font-size: 92px;
    line-height: 1.02;
    letter-spacing: -0.03em;
  }
  .side {
    position: absolute;
    left: 96px;
    top: 380px;
    font: 400 17px/1.4 "JetBrains Mono", monospace;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(242, 239, 230, 0.6);
  }
  .side b { color: #f2e34c; font-weight: 400; margin-right: 12px; }
  .window {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 640px;
    height: 660px;
    overflow: hidden;
    border-top: 1px solid rgba(242, 239, 230, 0.2);
  }
  .row {
    height: 130px;
    padding-top: 26px;
    border-bottom: 1px solid rgba(242, 239, 230, 0.14);
  }
  .role {
    font: 400 16px/1.3 "JetBrains Mono", monospace;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(242, 239, 230, 0.62);
  }
  .name {
    margin-top: 8px;
    font-size: 44px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .fade.top, .fade.bottom {
    position: absolute;
    left: 0;
    right: 0;
    height: 150px;
    pointer-events: none;
    z-index: 3;
  }
  .fade.top { top: 0; background: linear-gradient(to bottom, #101113 24%, rgba(16, 17, 19, 0)); }
  .fade.bottom { bottom: 0; background: linear-gradient(to top, #101113 24%, rgba(16, 17, 19, 0)); }
  .foot {
    position: absolute;
    left: 96px;
    right: 96px;
    bottom: 108px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font: 400 16px/1.4 "JetBrains Mono", monospace;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(242, 239, 230, 0.58);
  }
  .foot b { font-family: "Anton", sans-serif; font-size: 40px; font-weight: 400; letter-spacing: 0.04em; color: #f2efe6; }
  .rule {
    position: absolute;
    left: 96px;
    right: 96px;
    bottom: 190px;
    height: 2px;
    background: rgba(242, 239, 230, 0.32);
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="vertical-credits" data-root="true" data-width="1080" data-height="1920" data-fps="30" data-duration="4.5">
  <div class="kicker" data-clip-id="kicker" data-start="0" data-duration="4.5" data-enter="subir distance=16 dur=0.6 at=0.08 curve=ease-out">Encerramento</div>
  <div class="title" data-clip-id="title" data-start="0" data-duration="4.5" data-enter="subir distance=16 dur=0.7 at=0.15 curve=ease-out">Quem fez</div>
  <div class="side" data-clip-id="side" data-start="0" data-duration="4.5" data-enter="subir distance=16 dur=0.6 at=0.28 curve=ease-out"><b>06</b>nomes</div>

  <div class="window" data-clip-id="credits-window" data-start="0.3" data-duration="4.2">
    <div class="rows" data-keyframes='[{"time":0,"y":44,"curve":"linear"},{"time":4,"y":-780}]'>
      <div class="row"><div class="role">Direção</div><div class="name">Ana Vasconcelos</div></div>
      <div class="row"><div class="role">Roteiro</div><div class="name">Tomás Ferreira</div></div>
      <div class="row"><div class="role">Fotografia</div><div class="name">Miguel Braga</div></div>
      <div class="row"><div class="role">Montagem</div><div class="name">Clara Nogueira</div></div>
      <div class="row"><div class="role">Som</div><div class="name">Rui Amaral</div></div>
      <div class="row"><div class="role">Produção</div><div class="name">Estúdio Meia-Noite</div></div>
    </div>
    <div class="fade top"></div>
    <div class="fade bottom"></div>
  </div>

  <div class="rule"></div>
  <div class="foot"><span>14 dias de gravação · 2026</span><b>FF</b></div>
</div>
</body>
</html>
