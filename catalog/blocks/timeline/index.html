<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>timeline</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f6f3ea; }
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #f6f3ea;
    color: #14130f;
    font-family: "Inter", sans-serif;
  }
  .head {
    position: absolute;
    left: 120px;
    top: 92px;
    font: 400 20px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(20, 19, 15, 0.5);
  }
  .head b { color: #c8412a; font-weight: 400; margin-right: 16px; }
  .title {
    position: absolute;
    left: 116px;
    top: 146px;
    font-weight: 700;
    font-size: 74px;
    line-height: 1;
    letter-spacing: -0.035em;
  }
  .title span { color: rgba(20, 19, 15, 0.35); }
  .axis {
    position: absolute;
    left: 240px;
    top: 604px;
    width: 1460px;
    height: 2px;
    background: #14130f;
    transform-origin: left center;
  }
  .axis::after {
    content: "";
    position: absolute;
    right: 0;
    top: -5px;
    width: 12px;
    height: 12px;
    background: #14130f;
    transform: rotate(45deg);
  }
  .milestone {
    position: absolute;
    top: 604px;
    width: 300px;
    margin-left: -60px;
  }
  .milestone .dot {
    position: absolute;
    left: calc(50% - 9px);
    top: -9px;
    width: 18px;
    height: 18px;
    background: #f6f3ea;
    border: 2px solid #14130f;
    border-radius: 50%;
  }
  .milestone.active .dot { background: #c8412a; border-color: #c8412a; }
  .year {
    position: absolute;
    left: 0;
    bottom: 60px;
    width: 100%;
    font-family: "Bebas Neue", sans-serif;
    font-size: 118px;
    line-height: 1;
    letter-spacing: 0.03em;
    text-align: center;
    color: #14130f;
  }
  .label {
    position: absolute;
    left: 0;
    top: 52px;
    width: 100%;
    text-align: center;
  }
  .label strong {
    display: block;
    font-size: 27px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .label em {
    display: block;
    margin-top: 10px;
    font: 400 16px/1.5 "JetBrains Mono", monospace;
    font-style: normal;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(20, 19, 15, 0.6);
  }
  .m1 { left: 300px; }
  .m2 { left: 700px; }
  .m3 { left: 1100px; }
  .m4 { left: 1500px; }
  .foot {
    position: absolute;
    left: 120px;
    right: 120px;
    bottom: 96px;
    display: flex;
    justify-content: space-between;
    padding-top: 22px;
    border-top: 1px solid rgba(20, 19, 15, 0.2);
    font: 400 17px/1.6 "JetBrains Mono", monospace;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(20, 19, 15, 0.45);
  }
  .foot b { font-weight: 400; color: #14130f; }
</style>
</head>
<body>
<div class="stage" data-composition-id="timeline" data-root="true" data-width="1920" data-height="1080" data-fps="30" data-duration="4.5">
  <div class="head" data-clip-id="head" data-start="0" data-duration="4.5" data-enter="subir distance=12 dur=0.6 curve=ease-out"><b>Linha do tempo</b>2019 — 2026</div>
  <h1 class="title" data-clip-id="title" data-start="0.05" data-duration="4.45" data-enter="subir distance=12 dur=0.7 at=0.03 curve=ease-out">Sete anos, <span>quatro marcos.</span></h1>

  <div class="axis" data-clip-id="axis" data-start="0.15" data-duration="4.35" data-keyframes='[{"time":0,"scaleX":0,"curve":"cubic-bezier(0.22,0.8,0.2,1)"},{"time":0.85,"scaleX":1}]'></div>

  <div class="milestone m1" data-clip-id="mark-2019" data-start="0.32" data-duration="4.18">
    <div class="dot" data-keyframes='[{"time":0,"scale":0,"curve":"cubic-bezier(0.22,1.4,0.4,1)"},{"time":0.45,"scale":1}]'></div>
    <div class="year" data-enter="subir distance=22 dur=0.7 curve=cubic-bezier(0.22,0.8,0.2,1)">2019</div>
    <div class="label" data-enter="subir distance=12 dur=0.65 curve=ease-out"><strong>Primeiro curta</strong><em>Super 8 · 9 min</em></div>
  </div>

  <div class="milestone m2 active" data-clip-id="mark-2021" data-start="0.46" data-duration="4.04">
    <div class="dot" data-keyframes='[{"time":0,"scale":0,"curve":"cubic-bezier(0.22,1.4,0.4,1)"},{"time":0.45,"scale":1}]'></div>
    <div class="year" data-enter="subir distance=22 dur=0.7 curve=cubic-bezier(0.22,0.8,0.2,1)">2021</div>
    <div class="label" data-enter="subir distance=12 dur=0.65 curve=ease-out"><strong>Estúdio aberto</strong><em>Três sócios · Recife</em></div>
  </div>

  <div class="milestone m3" data-clip-id="mark-2023" data-start="0.6" data-duration="3.9">
    <div class="dot" data-keyframes='[{"time":0,"scale":0,"curve":"cubic-bezier(0.22,1.4,0.4,1)"},{"time":0.45,"scale":1}]'></div>
    <div class="year" data-enter="subir distance=22 dur=0.7 curve=cubic-bezier(0.22,0.8,0.2,1)">2023</div>
    <div class="label" data-enter="subir distance=12 dur=0.65 curve=ease-out"><strong>Série documental</strong><em>Seis episódios</em></div>
  </div>

  <div class="milestone m4 active" data-clip-id="mark-2026" data-start="0.74" data-duration="3.76">
    <div class="dot" data-keyframes='[{"time":0,"scale":0,"curve":"cubic-bezier(0.22,1.4,0.4,1)"},{"time":0.45,"scale":1}]'></div>
    <div class="year" data-enter="subir distance=22 dur=0.7 curve=cubic-bezier(0.22,0.8,0.2,1)">2026</div>
    <div class="label" data-enter="subir distance=12 dur=0.65 curve=ease-out"><strong>Longa-metragem</strong><em>Em finalização</em></div>
  </div>

  <div class="foot" data-clip-id="foot" data-start="1.1" data-duration="3.4" data-enter="subir distance=12 dur=0.8 curve=ease-out">
    <span><b>Arquivo FrankFrames</b> · linha do tempo</span>
    <span>4 de 4 marcos</span>
  </div>
</div>
</body>
</html>
