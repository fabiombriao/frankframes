<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>scene-iris</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #101113; }
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #101113;
    font-family: "Inter", sans-serif;
  }
  .layer { position: absolute; inset: 0; }
  .old {
    background: #101113;
    color: #f2efe6;
  }
  .old .mark {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font: 400 18px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(242, 239, 230, 0.55);
  }
  .new {
    background: #e9e3d3;
    color: #15130f;
    clip-path: circle(0% at 50% 46%);
    animation: iris 0.95s cubic-bezier(0.62, 0, 0.2, 1) both;
    animation-delay: 0.25s;
  }
  .ring {
    position: absolute;
    left: 50%;
    top: 46%;
    width: 300px;
    height: 300px;
    margin: -150px 0 0 -150px;
    border: 8px solid #d8452e;
    border-radius: 50%;
    opacity: 0;
    animation: ring 1.15s cubic-bezier(0.4, 0, 0.2, 1) both;
    animation-delay: 0.25s;
    z-index: 4;
  }
  .kicker {
    position: absolute;
    left: 104px;
    top: 96px;
    font: 400 20px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(21, 19, 15, 0.8);
  }
  .title {
    position: absolute;
    left: 100px;
    top: 50%;
    transform: translateY(-50%);
    font-family: "Playfair Display", serif;
    font-weight: 700;
    font-size: 150px;
    line-height: 1;
    letter-spacing: -0.03em;
    color: #15130f;
  }
  .title span { display: block; }
  .title span + span { color: #d8452e; font-style: italic; }
  .caption {
    position: absolute;
    right: 104px;
    bottom: 104px;
    width: 420px;
    text-align: right;
    font: 400 21px/1.6 "JetBrains Mono", monospace;
    letter-spacing: 0.04em;
    color: rgba(21, 19, 15, 0.82);
  }
  .corner {
    position: absolute;
    right: 104px;
    top: 96px;
    width: 72px;
    height: 72px;
    border-top: 4px solid #15130f;
    border-right: 4px solid #15130f;
  }
  @keyframes iris {
    from { clip-path: circle(0% at 50% 46%); }
    to { clip-path: circle(78% at 50% 46%); }
  }
  @keyframes ring {
    0% { transform: scale(0.1); opacity: 0; }
    55% { opacity: 0.9; }
    100% { transform: scale(2.6); opacity: 0; }
  }
  @keyframes rise {
    from { transform: translateY(-50%) translateY(34px); opacity: 0; }
    to { transform: translateY(-50%) translateY(0); opacity: 1; }
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="scene-iris" data-root="true" data-width="1920" data-height="1080" data-fps="30" data-duration="3.6">
  <div class="layer old" data-clip-id="scene-old" data-start="0" data-duration="3.6">
    <div class="mark">Abrir a cena</div>
  </div>

  <div class="layer new" data-clip-id="scene-new" data-start="0.25" data-duration="3.35">
    <div class="kicker" style="animation: fade-in 0.6s ease-out both; animation-delay: 0.9s">capítulo 04 — memória</div>
    <div class="corner" style="animation: fade-in 0.5s ease-out both; animation-delay: 0.95s"></div>
    <div class="title" style="animation: rise 0.8s cubic-bezier(0.22, 0.8, 0.2, 1) both; animation-delay: 0.78s">
      <span>O que</span>
      <span>ficou</span>
    </div>
    <div class="caption" style="animation: fade-in 0.7s ease-out both; animation-delay: 1.15s">Quatro entrevistas, uma tarde<br>e o que sobrou na mesa.</div>
  </div>

  <div class="ring" data-clip-id="iris-ring" data-start="0.25" data-duration="1.15"></div>
</div>
</body>
</html>
