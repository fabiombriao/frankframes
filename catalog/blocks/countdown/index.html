<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>countdown</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0e0f12; }
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #0e0f12;
    color: #f3efe4;
    font-family: "Inter", sans-serif;
  }
  .head {
    position: absolute;
    left: 116px;
    top: 92px;
    display: flex;
    justify-content: space-between;
    width: 1688px;
    font: 400 20px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(243, 239, 228, 0.5);
    animation: fade-in 0.7s ease-out both;
  }
  .head b { color: #f2e34c; font-weight: 400; }
  .beat {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
  }
  .ring {
    position: absolute;
    width: 700px;
    height: 700px;
    border: 2px solid rgba(243, 239, 228, 0.18);
    border-radius: 50%;
  }
  .ring::after {
    content: "";
    position: absolute;
    left: 50%;
    top: -9px;
    width: 16px;
    height: 16px;
    margin-left: -8px;
    border-radius: 50%;
    background: #f2e34c;
  }
  .digit {
    position: relative;
    font-family: "Anton", sans-serif;
    font-size: 640px;
    line-height: 1;
    letter-spacing: -0.02em;
    animation: pulse 1s cubic-bezier(0.22, 0.85, 0.24, 1) both;
  }
  .digit .unit {
    position: absolute;
    left: 50%;
    bottom: -116px;
    transform: translateX(-50%);
    font: 400 22px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(243, 239, 228, 0.6);
    white-space: nowrap;
  }
  .b2 .digit { animation-delay: 1s; }
  .b3 .digit { animation-delay: 2s; }
  .foot {
    position: absolute;
    left: 116px;
    bottom: 90px;
    width: 1688px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .foot .say {
    font: 400 20px/1.4 "JetBrains Mono", monospace;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(243, 239, 228, 0.55);
  }
  .ticks { display: flex; gap: 14px; }
  .ticks span {
    display: block;
    width: 96px;
    height: 5px;
    background: rgba(243, 239, 228, 0.2);
    animation: tick-on 1s linear both;
  }
  .ticks span:nth-child(2) { animation-delay: 1s; }
  .ticks span:nth-child(3) { animation-delay: 2s; }
  @keyframes pulse {
    0% { opacity: 0; transform: scale(1.16); }
    24% { opacity: 1; transform: scale(1); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes tick-on {
    from { background: rgba(243, 239, 228, 0.2); }
    to { background: #f2e34c; }
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="countdown" data-root="true" data-width="1920" data-height="1080" data-fps="30" data-duration="3">
  <div class="head" data-clip-id="countdown-head" data-start="0" data-duration="3">
    <span><b>●</b> Contagem regressiva</span>
    <span>Estúdio 04 · 30 fps</span>
  </div>

  <div class="beat" data-clip-id="beat-three" data-start="0" data-duration="1">
    <div class="ring"></div>
    <div class="digit">3<span class="unit">Prepara a câmera</span></div>
  </div>

  <div class="beat b2" data-clip-id="beat-two" data-start="beat-three" data-duration="1">
    <div class="ring"></div>
    <div class="digit">2<span class="unit">Ajusta a luz</span></div>
  </div>

  <div class="beat b3" data-clip-id="beat-one" data-start="beat-two" data-duration="1">
    <div class="ring"></div>
    <div class="digit">1<span class="unit">Silêncio no set</span></div>
  </div>

  <div class="foot" data-clip-id="countdown-foot" data-start="0" data-duration="3">
    <div class="say">A câmera começa a rodar em</div>
    <div class="ticks"><span></span><span></span><span></span></div>
  </div>
</div>
</body>
</html>
