<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>progress-bar</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #101113; }
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #101113;
    color: #f2efe6;
    font-family: "Inter", sans-serif;
  }
  .kicker {
    position: absolute;
    left: 180px;
    top: 132px;
    font: 400 20px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(242, 239, 230, 0.45);
  }
  .kicker b { color: #f2e34c; font-weight: 400; margin-right: 16px; }
  .headline {
    position: absolute;
    left: 176px;
    top: 214px;
    width: 1300px;
    font-size: 88px;
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.04em;
  }
  .headline span { color: rgba(242, 239, 230, 0.38); }
  .status {
    position: absolute;
    right: 180px;
    top: 236px;
    font: 400 19px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(242, 239, 230, 0.4);
    text-align: right;
  }
  .status b { display: block; margin-top: 12px; font-weight: 400; font-size: 26px; color: #f2e34c; letter-spacing: 0.06em; }
  .track {
    position: absolute;
    left: 180px;
    top: 596px;
    width: 1560px;
    height: 64px;
    background: #1d1f24;
    overflow: hidden;
  }
  .fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0%;
    background: #c8412a;
    animation: fill 1.7s cubic-bezier(0.65, 0.02, 0.28, 1) 0.25s both;
  }
  .fill::after {
    content: "";
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 14px;
    background: #f2e34c;
  }
  .ticks {
    position: absolute;
    left: 180px;
    top: 660px;
    width: 1560px;
    height: 22px;
    background-image: repeating-linear-gradient(90deg, rgba(242, 239, 230, 0.28) 0 2px, transparent 2px 156px);
  }
  .scale {
    position: absolute;
    left: 180px;
    top: 700px;
    width: 1560px;
    display: flex;
    justify-content: space-between;
    font: 400 17px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.1em;
    color: rgba(242, 239, 230, 0.5);
  }
  .legend {
    position: absolute;
    left: 180px;
    right: 180px;
    bottom: 120px;
    display: flex;
    justify-content: space-between;
    border-top: 1px solid rgba(242, 239, 230, 0.18);
    padding-top: 24px;
    font: 400 18px/1.6 "JetBrains Mono", monospace;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(242, 239, 230, 0.42);
  }
  .legend strong { display: block; font-family: "Inter", sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 0; text-transform: none; color: #f2efe6; }
  .check {
    display: inline-block;
    width: 20px;
    height: 20px;
    margin-right: 14px;
    background: #f2e34c;
    vertical-align: -2px;
  }
  @keyframes fill {
    from { width: 0%; }
    to { width: 100%; }
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="progress-bar" data-root="true" data-width="1920" data-height="1080" data-fps="30" data-duration="4">
  <div class="kicker" data-clip-id="kicker" data-start="0" data-duration="4" data-enter="subir distance=8 dur=0.6 curve=ease-out"><b>Render</b>Fila de exportação</div>

  <h1 class="headline" data-clip-id="headline" data-start="0.08" data-duration="3.92" data-enter="subir distance=24 dur=0.75 curve=cubic-bezier(0.22,0.8,0.2,1)">
    Quatro minutos de vídeo,<br><span>1.240 frames capturados.</span>
  </h1>

  <div class="status" data-clip-id="status" data-start="0.2" data-duration="3.8" data-enter="subir distance=8 dur=0.6 curve=ease-out">
    progresso
    <b id="done">100%</b>
  </div>

  <div class="track" data-clip-id="track" data-start="0.15" data-duration="3.85" data-enter="subir distance=8 dur=0.5 curve=ease-out">
    <div class="fill" data-clip-id="fill" data-start="0.25" data-duration="3.75"></div>
  </div>
  <div class="ticks" data-start="0.15" data-duration="3.85" data-enter="subir distance=8 dur=0.6 at=0.35 curve=ease-out"></div>
  <div class="scale" data-start="0.15" data-duration="3.85" data-enter="subir distance=8 dur=0.6 at=0.45 curve=ease-out">
    <span>0</span><span>25</span><span>50</span><span>75</span><span>100%</span>
  </div>

  <div class="legend" data-clip-id="legend" data-start="1.35" data-duration="2.65" data-enter="subir distance=8 dur=0.8 curve=ease-out">
    <div><strong><span class="check"></span>frames verificados</strong>SHA-256 por amostra</div>
    <div style="text-align:right"><strong>1920 × 1080 · 30 fps</strong>h264 · 12 Mbps</div>
  </div>
</div>
</body>
</html>
