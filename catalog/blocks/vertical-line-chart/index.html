<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>vertical-line-chart</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #101113; }
  .stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #101113;
    color: #f2efe6;
    font-family: "Inter", sans-serif;
  }
  .kicker {
    position: absolute;
    left: 96px;
    top: 120px;
    font: 400 21px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(242, 239, 230, 0.62);
  }
  .kicker b { color: #f2e34c; font-weight: 400; margin-right: 14px; }
  .title {
    position: absolute;
    left: 92px;
    top: 186px;
    width: 880px;
    font-size: 84px;
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.04em;
  }
  .title span { color: rgba(242, 239, 230, 0.5); }
  .final {
    position: absolute;
    left: 96px;
    top: 440px;
    display: flex;
    align-items: baseline;
    gap: 22px;
  }
  .final b {
    font-family: "Anton", sans-serif;
    font-size: 168px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0.01em;
    color: #f2e34c;
  }
  .final small {
    font: 400 18px/1.4 "JetBrains Mono", monospace;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(242, 239, 230, 0.68);
  }
  .plot {
    position: absolute;
    left: 96px;
    top: 740px;
    width: 888px;
    height: 760px;
  }
  .plot svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .grid { stroke: rgba(242, 239, 230, 0.14); stroke-width: 1.5; }
  .base { stroke: rgba(242, 239, 230, 0.55); stroke-width: 2.5; }
  .tick {
    font-family: "JetBrains Mono", monospace;
    font-size: 19px;
    fill: rgba(242, 239, 230, 0.64);
    letter-spacing: 0.06em;
  }
  .series {
    fill: none;
    stroke: #f2e34c;
    stroke-width: 7;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: draw 1.8s cubic-bezier(0.4, 0, 0.2, 1) both;
    animation-delay: 0.55s;
  }
  .dot {
    fill: #f2e34c;
  }
  .halo {
    fill: none;
    stroke: rgba(242, 227, 76, 0.4);
    stroke-width: 3;
  }
  .foot {
    position: absolute;
    left: 96px;
    bottom: 150px;
    font: 400 17px/1.6 "JetBrains Mono", monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(242, 239, 230, 0.56);
  }
  .stamp {
    position: absolute;
    right: 96px;
    bottom: 132px;
    font-family: "Anton", sans-serif;
    font-size: 46px;
    color: rgba(242, 239, 230, 0.85);
  }
  @keyframes draw {
    from { stroke-dashoffset: 1; }
    to { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="vertical-line-chart" data-root="true" data-width="1080" data-height="1920" data-fps="30" data-duration="4">
  <div class="kicker" data-clip-id="kicker" data-start="0" data-duration="4" data-enter="surgir dur=0.6 at=0.08 curve=ease-out"><b>01</b>uso diário</div>
  <div class="title" data-clip-id="title" data-start="0" data-duration="4" data-enter="subir distance=24 dur=0.7 at=0.15 curve=ease-out">O hábito <span>pegou.</span></div>

  <div class="final" data-clip-id="final-value" data-start="1.9" data-duration="2.1" data-enter="subir distance=24 dur=0.6 curve=ease-out"><b>128</b><small>unid. por dia<br>junho de 2026</small></div>

  <div class="plot" data-clip-id="plot" data-start="0.5" data-duration="3.5">
    <svg viewBox="0 0 888 760" role="img" aria-label="Uma série de uso diário crescendo de 40 para 128 unidades">
      <line class="grid" x1="80" y1="40" x2="860" y2="40"></line>
      <line class="grid" x1="80" y1="240" x2="860" y2="240"></line>
      <line class="grid" x1="80" y1="440" x2="860" y2="440"></line>
      <line class="base" x1="80" y1="640" x2="860" y2="640"></line>

      <text class="tick" x="58" y="46" text-anchor="end">120</text>
      <text class="tick" x="58" y="246" text-anchor="end">80</text>
      <text class="tick" x="58" y="446" text-anchor="end">40</text>
      <text class="tick" x="58" y="646" text-anchor="end">0</text>

      <text class="tick" x="80" y="692" text-anchor="middle">JAN</text>
      <text class="tick" x="236" y="692" text-anchor="middle">FEV</text>
      <text class="tick" x="392" y="692" text-anchor="middle">MAR</text>
      <text class="tick" x="548" y="692" text-anchor="middle">ABR</text>
      <text class="tick" x="704" y="692" text-anchor="middle">MAI</text>
      <text class="tick" x="860" y="692" text-anchor="middle">JUN</text>

      <path class="series" pathLength="1" d="M80 469 L236 404 L392 349 L548 246 L704 177 L860 91"></path>

      <circle class="halo" cx="860" cy="91" r="24" data-enter="surgir dur=0.5 at=1.75 curve=ease-out"></circle>
      <circle class="dot" cx="860" cy="91" r="11" data-enter="surgir dur=0.45 at=1.65 curve=ease-out"></circle>
    </svg>
  </div>

  <div class="foot" data-clip-id="foot" data-start="0" data-duration="4" data-enter="surgir dur=0.6 at=1.35 curve=ease-out">Média móvel de 7 dias · exclui fins de semana</div>
  <div class="stamp" data-clip-id="stamp" data-start="0" data-duration="4" data-enter="surgir dur=0.6 at=1.45 curve=ease-out">FIG. 08</div>
</div>
</body>
</html>
