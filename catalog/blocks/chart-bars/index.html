<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>chart-bars</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f4f2ec; }
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #f4f2ec;
    color: #151513;
    font-family: "Manrope", sans-serif;
  }
  .kicker {
    position: absolute;
    left: 104px;
    top: 84px;
    font: 400 19px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(21, 21, 19, 0.55);
  }
  .title {
    position: absolute;
    left: 100px;
    top: 128px;
    font-family: "Manrope", sans-serif;
    font-weight: 700;
    font-size: 96px;
    line-height: 0.98;
    letter-spacing: -0.045em;
  }
  .title span { display: block; }
  .subtitle {
    position: absolute;
    right: 104px;
    top: 152px;
    font: 400 19px/1.6 "JetBrains Mono", monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: right;
    color: rgba(21, 21, 19, 0.55);
  }
  .chart {
    position: absolute;
    left: 104px;
    right: 104px;
    top: 372px;
    background:
      linear-gradient(90deg, rgba(21, 21, 19, 0.1) 1px, transparent 1px) 0 0 / 25% 100%;
    border-bottom: 2px solid #151513;
    padding-bottom: 22px;
  }
  .row {
    display: grid;
    grid-template-columns: 300px 1fr 130px;
    align-items: center;
    gap: 26px;
    height: 136px;
    border-top: 1px solid rgba(21, 21, 19, 0.2);
  }
  .row .label {
    font-family: "Manrope", sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .row .label em { display: block; font: 400 15px/1.4 "JetBrains Mono", monospace; font-style: normal; letter-spacing: 0.08em; color: rgba(21, 21, 19, 0.5); margin-top: 8px; }
  .track {
    position: relative;
    height: 64px;
    background: rgba(21, 21, 19, 0.07);
  }
  .bar {
    height: 100%;
    width: var(--w);
    background: #151513;
    transform-origin: left center;
    animation: grow 0.95s cubic-bezier(0.16, 0.85, 0.25, 1) both;
  }
  .row.accent .bar { background: #d8452e; }
  .row .value {
    font-family: "JetBrains Mono", monospace;
    font-size: 29px;
    text-align: right;
    letter-spacing: -0.02em;
  }
  .row .value small { display: block; font-size: 14px; letter-spacing: 0.08em; color: rgba(21, 21, 19, 0.5); margin-top: 6px; }
  .footnote {
    position: absolute;
    left: 104px;
    bottom: 76px;
    font: 400 17px/1.6 "JetBrains Mono", monospace;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: rgba(21, 21, 19, 0.52);
  }
  .stamp {
    position: absolute;
    right: 104px;
    bottom: 68px;
    font-family: "Anton", sans-serif;
    font-size: 48px;
    letter-spacing: 0.02em;
    color: #d8452e;
  }
  @keyframes grow {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }
  @keyframes fade-up {
    from { transform: translateY(18px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="chart-bars" data-root="true" data-width="1920" data-height="1080" data-fps="30" data-duration="4">
  <div class="kicker" data-clip-id="kicker" data-start="0" data-duration="4">Diário de produção / 24 projetos</div>

  <div class="title" data-clip-id="title" data-start="0.1" data-duration="3.9" style="animation: fade-up 0.7s ease-out both">
    <span>Onde o tempo</span>
    <span>vai embora.</span>
  </div>

  <div class="subtitle" data-clip-id="subtitle" data-start="0.25" data-duration="3.75" style="animation: fade-up 0.7s ease-out 0.2s both">
    Minutos por etapa<br>média por projeto
  </div>

  <div class="chart">
    <div class="row" data-clip-id="row-decupagem" data-start="0.4" data-duration="3.6">
      <div class="label">Decupagem<em>Pré-produção</em></div>
      <div class="track"><div class="bar" style="--w: 42%; animation-delay: 0.4s"></div></div>
      <div class="value">42<small>MIN</small></div>
    </div>
    <div class="row" data-clip-id="row-montagem" data-start="0.55" data-duration="3.45">
      <div class="label">Montagem<em>Sala de corte</em></div>
      <div class="track"><div class="bar" style="--w: 78%; animation-delay: 0.55s"></div></div>
      <div class="value">78<small>MIN</small></div>
    </div>
    <div class="row" data-clip-id="row-cor" data-start="0.7" data-duration="3.3">
      <div class="label">Correção<em>Cor e acabamento</em></div>
      <div class="track"><div class="bar" style="--w: 31%; animation-delay: 0.7s"></div></div>
      <div class="value">31<small>MIN</small></div>
    </div>
    <div class="row accent" data-clip-id="row-mixagem" data-start="0.85" data-duration="3.15">
      <div class="label">Mixagem<em>Som final</em></div>
      <div class="track"><div class="bar" style="--w: 19%; animation-delay: 0.85s"></div></div>
      <div class="value">19<small>MIN</small></div>
    </div>
  </div>

  <div class="footnote" data-clip-id="footnote" data-start="1.15" data-duration="2.85" style="animation: fade-up 0.7s ease-out 1.1s both">
    Etapas medidas em 24 cortes finalizados · 2024–2026
  </div>
  <div class="stamp" data-clip-id="stamp" data-start="1.4" data-duration="2.6" style="animation: fade-up 0.6s ease-out 1.3s both">FIG. 05</div>
</div>
</body>
</html>
