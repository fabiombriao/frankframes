<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>subtitles</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0b0c0e; }
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #0b0c0e;
    color: #f4f1e8;
    font-family: "Inter", sans-serif;
  }
  .band-a {
    position: absolute;
    left: 0;
    top: 0;
    width: 560px;
    height: 1080px;
    background: #121418;
  }
  .band-b {
    position: absolute;
    left: 1180px;
    top: 0;
    width: 740px;
    height: 1080px;
    background: #14171c;
  }
  .lamp {
    position: absolute;
    left: 700px;
    top: 0;
    width: 420px;
    height: 1080px;
    background: #191d22;
    transform-origin: top center;
    animation: lamp-in 0.9s cubic-bezier(0.22, 0.8, 0.2, 1) both;
  }
  .horizon {
    position: absolute;
    left: 0;
    right: 0;
    top: 690px;
    height: 2px;
    background: rgba(244, 241, 232, 0.14);
  }
  .marker {
    position: absolute;
    left: 96px;
    top: 88px;
    font: 400 18px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(244, 241, 232, 0.4);
    animation: fade-in 0.6s ease-out both;
  }
  .marker b { color: #f2e34c; font-weight: 400; margin-right: 14px; }
  .safe {
    position: absolute;
    left: 96px;
    right: 96px;
    bottom: 96px;
    height: 1px;
    background: rgba(244, 241, 232, 0.12);
  }
  .cap {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 168px;
    text-align: center;
  }
  .speaker {
    display: inline-block;
    margin-bottom: 20px;
    font: 400 17px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #f2e34c;
  }
  .line {
    display: inline-block;
    padding: 18px 32px 22px;
    background: rgba(6, 7, 9, 0.78);
    font-size: 52px;
    font-weight: 600;
    line-height: 1.24;
    letter-spacing: -0.012em;
    animation: cap-in 0.36s cubic-bezier(0.22, 0.8, 0.2, 1) both;
  }
  .line em { font-style: normal; color: #f2e34c; }
  .c2 .line { animation-delay: 1.31s; }
  .c3 .line { animation-delay: 2.76s; }
  .c3 .speaker { color: #e8a58a; }
  @keyframes lamp-in {
    from { transform: scaleY(0); opacity: 0; }
    to { transform: scaleY(1); opacity: 1; }
  }
  @keyframes cap-in {
    from { transform: translateY(16px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="subtitles" data-root="true" data-width="1920" data-height="1080" data-fps="30" data-duration="4.5">
  <div class="band-a"></div>
  <div class="band-b"></div>
  <div class="lamp"></div>
  <div class="horizon"></div>
  <div class="safe"></div>

  <div class="marker" data-clip-id="marker" data-start="0" data-duration="4.5"><b>Legendas</b>pt-BR · sequência</div>

  <div class="cap c1" data-clip-id="legenda1" data-start="0" data-duration="1.35">
    <span class="speaker">Mara</span>
    <div class="line">A gente filmou a cidade por <em>trinta dias</em>.</div>
  </div>

  <div class="cap c2" data-clip-id="legenda2" data-start="legenda1" data-duration="1.35">
    <span class="speaker">João</span>
    <div class="line">E o que sobrava no fim era <em>silêncio</em>.</div>
  </div>

  <div class="cap c3" data-clip-id="legenda3" data-start="legenda2 + 0.1" data-duration="1.3">
    <span class="speaker">Mara</span>
    <div class="line">Então o filme virou sobre <em>essa sobra</em>.</div>
  </div>
</div>
</body>
</html>
