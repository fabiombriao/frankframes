<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>vertical-scene-wipe</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #14130f; }
  .stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #14130f;
    font-family: "Inter", sans-serif;
  }
  .layer { position: absolute; inset: 0; }
  .old { background: #14130f; color: #f2efe6; }
  .new {
    background: #e9e3d3;
    color: #15130f;
  }
  .kicker {
    position: absolute;
    left: 96px;
    top: 120px;
    font: 400 20px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(21, 19, 15, 0.78);
  }
  .old .kicker { color: rgba(242, 239, 230, 0.68); }
  .headline {
    position: absolute;
    left: 92px;
    bottom: 220px;
    width: 900px;
    font-family: "Anton", sans-serif;
    font-size: 150px;
    line-height: 0.92;
    text-transform: uppercase;
    letter-spacing: 0.005em;
  }
  .headline span { display: block; }
  .old .headline { color: rgba(242, 239, 230, 0.4); }
  .new .headline { color: #15130f; }
  .body {
    position: absolute;
    left: 96px;
    top: 210px;
    width: 700px;
    font-size: 30px;
    line-height: 1.5;
    color: #302d24;
  }
  .rule {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 180px;
    height: 3px;
    background: rgba(21, 19, 15, 0.5);
  }
  .band {
    position: absolute;
    left: 0;
    right: 0;
    top: -360px;
    height: 360px;
    background: #d8452e;
    z-index: 5;
  }
  .band::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 10px;
    background: #14130f;
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="vertical-scene-wipe" data-root="true" data-width="1080" data-height="1920" data-fps="30" data-duration="3.6">
  <div class="layer old" data-clip-id="scene-old" data-start="0" data-duration="3.6">
    <div class="kicker">Cena 01 / estúdio</div>
    <div class="headline"><span>Luz</span><span>fria</span></div>
  </div>

  <div class="layer new" data-clip-id="scene-new" data-start="0.25" data-duration="3.35" data-keyframes='[{"time":0,"clip":"inset(0% 0% 100% 0%)","curve":"cubic-bezier(0.72,0,0.18,1)"},{"time":0.5,"clip":"inset(0% 0% 0% 0%)"}]'>
    <div class="kicker" data-enter="surgir dur=0.5 at=0.6 curve=ease-out">Cena 02 / varanda</div>
    <div class="rule" data-enter="surgir dur=0.45 at=0.55 curve=ease-out"></div>
    <div class="body" data-enter="subir distance=28 dur=0.6 at=0.67 curve=ease-out">A faixa desce e troca a luz sem cortar o áudio.</div>
    <div class="headline"><span data-enter="subir distance=28 dur=0.65 at=0.53 curve=cubic-bezier(0.22,0.8,0.2,1)">Luz</span><span data-enter="subir distance=28 dur=0.65 at=0.61 curve=cubic-bezier(0.22,0.8,0.2,1)">quente</span></div>
  </div>

  <div class="band" data-clip-id="wipe-band" data-start="0.25" data-duration="0.5" data-keyframes='[{"time":0,"y":0,"curve":"cubic-bezier(0.72,0,0.18,1)"},{"time":0.5,"y":2280}]'></div>
</div>
</body>
</html>
