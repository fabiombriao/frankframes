<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>vertical-scene-wipe</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #14130f; }
  .stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #14130f;
    font-family: "Inter", sans-serif;
  }
  .layer { position: absolute; inset: 0; }
  .old { background: #14130f; color: #f2efe6; }
  .new {
    background: #e9e3d3;
    color: #15130f;
    clip-path: inset(0 0 100% 0);
    animation: reveal 0.5s cubic-bezier(0.72, 0, 0.18, 1) both;
    animation-delay: 0.25s;
  }
  .kicker {
    position: absolute;
    left: 96px;
    top: 120px;
    font: 400 20px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(21, 19, 15, 0.78);
  }
  .old .kicker { color: rgba(242, 239, 230, 0.68); }
  .headline {
    position: absolute;
    left: 92px;
    bottom: 220px;
    width: 900px;
    font-family: "Anton", sans-serif;
    font-size: 150px;
    line-height: 0.92;
    text-transform: uppercase;
    letter-spacing: 0.005em;
  }
  .headline span { display: block; }
  .old .headline { color: rgba(242, 239, 230, 0.4); }
  .new .headline { color: #15130f; }
  .body {
    position: absolute;
    left: 96px;
    top: 210px;
    width: 700px;
    font-size: 30px;
    line-height: 1.5;
    color: #302d24;
  }
  .rule {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 180px;
    height: 3px;
    background: rgba(21, 19, 15, 0.5);
  }
  .band {
    position: absolute;
    left: 0;
    right: 0;
    top: -360px;
    height: 360px;
    background: #d8452e;
    animation: cross 0.5s cubic-bezier(0.72, 0, 0.18, 1) both;
    animation-delay: 0.25s;
    z-index: 5;
  }
  .band::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 10px;
    background: #14130f;
  }
  @keyframes reveal {
    from { clip-path: inset(0 0 100% 0); }
    to { clip-path: inset(0 0 0 0); }
  }
  @keyframes cross {
    from { transform: translateY(0); }
    to { transform: translateY(2280px); }
  }
  @keyframes rise {
    from { transform: translateY(28px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="vertical-scene-wipe" data-root="true" data-width="1080" data-height="1920" data-fps="30" data-duration="3.6">
  <div class="layer old" data-clip-id="scene-old" data-start="0" data-duration="3.6">
    <div class="kicker">Cena 01 / estúdio</div>
    <div class="headline"><span>Luz</span><span>fria</span></div>
  </div>

  <div class="layer new" data-clip-id="scene-new" data-start="0.25" data-duration="3.35">
    <div class="kicker" style="animation: fade-in 0.5s ease-out both; animation-delay: 0.85s">Cena 02 / varanda</div>
    <div class="rule" style="animation: fade-in 0.45s ease-out both; animation-delay: 0.8s"></div>
    <div class="body" style="animation: rise 0.6s ease-out both; animation-delay: 0.92s">A faixa desce e troca a luz sem cortar o áudio.</div>
    <div class="headline"><span style="animation: rise 0.65s cubic-bezier(0.22, 0.8, 0.2, 1) both; animation-delay: 0.78s">Luz</span><span style="animation: rise 0.65s cubic-bezier(0.22, 0.8, 0.2, 1) both; animation-delay: 0.86s">quente</span></div>
  </div>

  <div class="band" data-clip-id="wipe-band" data-start="0.25" data-duration="0.5"></div>
</div>
</body>
</html>
