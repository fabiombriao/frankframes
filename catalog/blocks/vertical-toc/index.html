<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>vertical-toc</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #101113; }
  .stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #101113;
    color: #f2efe6;
    font-family: "Inter", sans-serif;
  }
  .kicker {
    position: absolute;
    left: 96px;
    top: 120px;
    font: 400 20px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(242, 239, 230, 0.62);
  }
  .kicker b { color: #f2e34c; font-weight: 400; margin-right: 14px; }
  .title {
    position: absolute;
    left: 92px;
    top: 186px;
    width: 880px;
    font-size: 96px;
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.045em;
  }
  .title span { color: rgba(242, 239, 230, 0.48); }
  .list {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 620px;
    border-top: 2px solid rgba(242, 239, 230, 0.55);
  }
  .item {
    display: grid;
    grid-template-columns: 130px 1fr;
    align-items: center;
    gap: 24px;
    height: 208px;
    border-bottom: 1px solid rgba(242, 239, 230, 0.2);
    opacity: 0;
    animation: item-in 0.7s cubic-bezier(0.22, 0.8, 0.2, 1) both;
  }
  .item:nth-child(1) { animation-delay: 0.35s; }
  .item:nth-child(2) { animation-delay: 0.5s; }
  .item:nth-child(3) { animation-delay: 0.65s; }
  .item:nth-child(4) { animation-delay: 0.8s; }
  .num {
    font-family: "JetBrains Mono", monospace;
    font-size: 40px;
    letter-spacing: 0.04em;
    color: rgba(242, 239, 230, 0.5);
  }
  .text b {
    display: block;
    font-size: 68px;
    font-weight: 700;
    line-height: 1.06;
    letter-spacing: -0.03em;
  }
  .text small {
    display: block;
    margin-top: 12px;
    font: 400 20px/1.4 "JetBrains Mono", monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(242, 239, 230, 0.62);
  }
  .item.current .num { color: #f2e34c; }
  .item.current .text b { color: #f2e34c; }
  .marker {
    position: absolute;
    left: 0;
    top: 0;
    width: 84px;
    height: 6px;
    background: #f2e34c;
    animation: marker 0.6s ease-out both;
    animation-delay: 0.5s;
  }
  .foot {
    position: absolute;
    left: 96px;
    right: 96px;
    bottom: 120px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font: 400 17px/1.4 "JetBrains Mono", monospace;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(242, 239, 230, 0.6);
    animation: fade-in 0.6s ease-out both;
    animation-delay: 1.1s;
  }
  .foot b { font-family: "Anton", sans-serif; font-size: 42px; font-weight: 400; letter-spacing: 0.04em; color: #f2efe6; }
  @keyframes item-in {
    from { transform: translateX(-38px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes marker {
    from { transform: scaleX(0); transform-origin: left center; }
    to { transform: scaleX(1); transform-origin: left center; }
  }
  @keyframes rise {
    from { transform: translateY(24px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="vertical-toc" data-root="true" data-width="1080" data-height="1920" data-fps="30" data-duration="4">
  <div class="kicker" style="animation: fade-in 0.6s ease-out both; animation-delay: 0.08s"><b>04</b>índice</div>
  <div class="title" style="animation: rise 0.7s ease-out both; animation-delay: 0.15s">Nesta <span>edição.</span></div>

  <div class="list" data-clip-id="toc-list" data-start="0.3" data-duration="3.7">
    <div class="item current">
      <div class="num">01</div>
      <div class="text"><b>A sala às seis</b><small>Abertura · 2 min</small></div>
    </div>
    <div class="item">
      <div class="num">02</div>
      <div class="text"><b>O corte que faltou</b><small>O problema · 5 min</small></div>
    </div>
    <div class="item">
      <div class="num">03</div>
      <div class="text"><b>A ordem certa</b><small>A virada · 4 min</small></div>
    </div>
    <div class="item">
      <div class="num">04</div>
      <div class="text"><b>O que vem depois</b><small>Encerramento · 1 min</small></div>
    </div>
    <div class="marker"></div>
  </div>

  <div class="foot">
    <span>12 minutos no total</span><b>FF</b>
  </div>
</div>
</body>
</html>
