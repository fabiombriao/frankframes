<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>section-header</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #efece3; }
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #efece3;
    color: #14130f;
    font-family: "Inter", sans-serif;
  }
  .rule-top {
    position: absolute;
    left: 120px;
    right: 120px;
    top: 96px;
    height: 2px;
    background: #14130f;
    transform-origin: left center;
    animation: rule-in 0.75s cubic-bezier(0.22, 0.8, 0.2, 1) both;
  }
  .kicker {
    position: absolute;
    left: 120px;
    top: 126px;
    font: 400 21px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(20, 19, 15, 0.55);
    animation: fade-in 0.6s ease-out 0.1s both;
  }
  .index {
    position: absolute;
    right: 118px;
    top: 118px;
    font-family: "Bebas Neue", sans-serif;
    font-size: 150px;
    line-height: 0.9;
    letter-spacing: 0.02em;
    color: #c8412a;
    animation: index-in 0.8s cubic-bezier(0.22, 0.8, 0.2, 1) 0.08s both;
  }
  .title {
    position: absolute;
    left: 112px;
    top: 322px;
    width: 1540px;
    font-weight: 700;
    font-size: 168px;
    line-height: 0.94;
    letter-spacing: -0.045em;
  }
  .title span { display: block; overflow: hidden; }
  .title i {
    display: block;
    font-style: normal;
    animation: line-in 0.9s cubic-bezier(0.22, 0.8, 0.2, 1) both;
  }
  .title .accent { color: #c8412a; }
  .title .line-one i { animation-delay: 0.2s; }
  .title .line-two i { animation-delay: 0.32s; }
  .subtitle {
    position: absolute;
    left: 120px;
    top: 790px;
    width: 760px;
    font-size: 30px;
    line-height: 1.45;
    color: rgba(20, 19, 15, 0.68);
    animation: fade-in 0.8s ease-out 0.6s both;
  }
  .aside {
    position: absolute;
    right: 120px;
    bottom: 122px;
    width: 420px;
    border-top: 1px solid rgba(20, 19, 15, 0.35);
    padding-top: 20px;
    text-align: right;
    font: 400 19px/1.9 "JetBrains Mono", monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(20, 19, 15, 0.55);
    animation: fade-in 0.8s ease-out 0.75s both;
  }
  .aside strong { display: block; font-family: "Inter", sans-serif; font-weight: 700; font-size: 23px; letter-spacing: 0; text-transform: none; color: #14130f; }
  .tick {
    position: absolute;
    left: 120px;
    bottom: 122px;
    display: flex;
    gap: 8px;
  }
  .tick b {
    display: block;
    width: 46px;
    height: 6px;
    background: rgba(20, 19, 15, 0.18);
    transform-origin: left center;
    animation: tick-in 0.5s ease-out both;
  }
  .tick b:nth-child(1) { background: #c8412a; animation-delay: 0.7s; }
  .tick b:nth-child(2) { animation-delay: 0.78s; }
  .tick b:nth-child(3) { animation-delay: 0.86s; }
  .tick b:nth-child(4) { animation-delay: 0.94s; }
  @keyframes rule-in {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }
  @keyframes line-in {
    from { transform: translateY(105%); }
    to { transform: translateY(0); }
  }
  @keyframes index-in {
    from { transform: translateY(-26px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes tick-in {
    from { transform: scaleX(0); opacity: 0; }
    to { transform: scaleX(1); opacity: 1; }
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="section-header" data-root="true" data-width="1920" data-height="1080" data-fps="30" data-duration="4">
  <div class="rule-top"></div>
  <div class="kicker" data-clip-id="kicker" data-start="0" data-duration="4">Capítulo 04 — Processo</div>
  <div class="index" data-clip-id="index" data-start="0" data-duration="4">04</div>

  <h1 class="title" data-clip-id="title" data-start="0.2" data-duration="3.8">
    <span class="line-one"><i>O que fica</i></span>
    <span class="line-two"><i>fora do <em class="accent" style="font-style:normal">quadro</em></i></span>
  </h1>

  <p class="subtitle" data-clip-id="subtitle" data-start="0.6" data-duration="3.4">
    Uma conversa sobre montagem, silêncio e as decisões que ninguém vê no arquivo final.
  </p>

  <div class="tick">
    <b></b><b></b><b></b><b></b>
  </div>

  <div class="aside" data-clip-id="aside" data-start="0.75" data-duration="3.25">
    <strong>Série Ofício</strong>
    12 min · 2026
  </div>
</div>
</body>
</html>
