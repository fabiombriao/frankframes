<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>section-header</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #efece3; }
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #efece3;
    color: #14130f;
    font-family: "Inter", sans-serif;
  }
  .rule-top {
    position: absolute;
    left: 120px;
    right: 120px;
    top: 96px;
    height: 2px;
    background: #14130f;
    transform-origin: left center;
  }
  .kicker {
    position: absolute;
    left: 120px;
    top: 126px;
    font: 400 21px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(20, 19, 15, 0.55);
  }
  .index {
    position: absolute;
    right: 118px;
    top: 118px;
    font-family: "Bebas Neue", sans-serif;
    font-size: 150px;
    line-height: 0.9;
    letter-spacing: 0.02em;
    color: #c8412a;
  }
  .title {
    position: absolute;
    left: 112px;
    top: 322px;
    width: 1540px;
    font-weight: 700;
    font-size: 168px;
    line-height: 0.94;
    letter-spacing: -0.045em;
  }
  .title span { display: block; overflow: hidden; }
  .title i {
    display: block;
    font-style: normal;
  }
  .title .accent { color: #c8412a; }
  .subtitle {
    position: absolute;
    left: 120px;
    top: 790px;
    width: 760px;
    font-size: 30px;
    line-height: 1.45;
    color: rgba(20, 19, 15, 0.68);
  }
  .aside {
    position: absolute;
    right: 120px;
    bottom: 122px;
    width: 420px;
    border-top: 1px solid rgba(20, 19, 15, 0.35);
    padding-top: 20px;
    text-align: right;
    font: 400 19px/1.9 "JetBrains Mono", monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(20, 19, 15, 0.55);
  }
  .aside strong { display: block; font-family: "Inter", sans-serif; font-weight: 700; font-size: 23px; letter-spacing: 0; text-transform: none; color: #14130f; }
  .tick {
    position: absolute;
    left: 120px;
    bottom: 122px;
    display: flex;
    gap: 8px;
  }
  .tick b {
    display: block;
    width: 46px;
    height: 6px;
    background: rgba(20, 19, 15, 0.18);
    transform-origin: left center;
  }
  .tick b:nth-child(1) { background: #c8412a; }
</style>
</head>
<body>
<div class="stage" data-composition-id="section-header" data-root="true" data-width="1920" data-height="1080" data-fps="30" data-duration="4">
  <div class="rule-top" data-clip-id="rule-top" data-start="0" data-duration="4" data-keyframes='[{"time":0,"scaleX":0,"curve":"cubic-bezier(0.22,0.8,0.2,1)"},{"time":0.75,"scaleX":1}]'></div>
  <div class="kicker" data-clip-id="kicker" data-start="0" data-duration="4" data-enter="subir distance=10 dur=0.6 at=0.1 curve=ease-out">Capítulo 04 — Processo</div>
  <div class="index" data-clip-id="index" data-start="0" data-duration="4" data-enter="descer distance=26 dur=0.8 at=0.08 curve=cubic-bezier(0.22,0.8,0.2,1)">04</div>

  <h1 class="title" data-clip-id="title" data-start="0.2" data-duration="3.8">
    <span class="line-one"><i data-keyframes='[{"time":0,"y":165.816,"curve":"cubic-bezier(0.22,0.8,0.2,1)"},{"time":0.9,"y":0}]'>O que fica</i></span>
    <span class="line-two"><i data-keyframes='[{"time":0.12,"y":165.816,"curve":"cubic-bezier(0.22,0.8,0.2,1)"},{"time":1.02,"y":0}]'>fora do <em class="accent" style="font-style:normal">quadro</em></i></span>
  </h1>

  <p class="subtitle" data-clip-id="subtitle" data-start="0.6" data-duration="3.4" data-enter="subir distance=10 dur=0.8 curve=ease-out">
    Uma conversa sobre montagem, silêncio e as decisões que ninguém vê no arquivo final.
  </p>

  <div class="tick" data-clip-id="tick" data-start="0" data-duration="4">
    <b data-keyframes='[{"time":0.7,"scaleX":0,"opacity":0,"curve":"cubic-bezier(0,0,0.58,1)"},{"time":1.2,"scaleX":1,"opacity":1}]'></b><b data-keyframes='[{"time":0.78,"scaleX":0,"opacity":0,"curve":"cubic-bezier(0,0,0.58,1)"},{"time":1.28,"scaleX":1,"opacity":1}]'></b><b data-keyframes='[{"time":0.86,"scaleX":0,"opacity":0,"curve":"cubic-bezier(0,0,0.58,1)"},{"time":1.36,"scaleX":1,"opacity":1}]'></b><b data-keyframes='[{"time":0.94,"scaleX":0,"opacity":0,"curve":"cubic-bezier(0,0,0.58,1)"},{"time":1.44,"scaleX":1,"opacity":1}]'></b>
  </div>

  <div class="aside" data-clip-id="aside" data-start="0.75" data-duration="3.25" data-enter="subir distance=10 dur=0.8 curve=ease-out">
    <strong>Série Ofício</strong>
    12 min · 2026
  </div>
</div>
</body>
</html>
