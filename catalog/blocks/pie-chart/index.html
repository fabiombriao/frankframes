<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>pie-chart</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f2efe6; }
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #f2efe6;
    color: #17150f;
    font-family: "Inter", sans-serif;
  }
  .kicker {
    position: absolute;
    left: 104px;
    top: 88px;
    font: 400 19px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(23, 21, 15, 0.72);
  }
  .title {
    position: absolute;
    left: 100px;
    top: 128px;
    width: 780px;
    font-size: 86px;
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.045em;
  }
  .title em { font-style: normal; color: #d8452e; }
  .pie-wrap {
    position: absolute;
    left: 160px;
    top: 392px;
    width: 560px;
    height: 560px;
    animation: pie-in 0.8s cubic-bezier(0.22, 0.8, 0.2, 1) both;
    animation-delay: 0.25s;
  }
  .pie {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(#d8452e 0 46%, #1d1b16 46% 77%, #b6ad97 77% 100%);
  }
  .slice-pop {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(#f0553b 0 46%, transparent 46% 100%);
    transform: translate(26px, -6px);
    opacity: 0;
    animation: pop 0.5s ease-out both;
    animation-delay: 1.15s;
  }
  .hole {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 320px;
    height: 320px;
    margin: -160px 0 0 -160px;
    border-radius: 50%;
    background: #f2efe6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .hole b {
    font-family: "Anton", sans-serif;
    font-size: 108px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0.01em;
  }
  .hole small {
    margin-top: 10px;
    font: 400 16px/1.2 "JetBrains Mono", monospace;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(23, 21, 15, 0.72);
  }
  .legend {
    position: absolute;
    left: 900px;
    top: 420px;
    width: 900px;
    border-top: 2px solid #17150f;
  }
  .row {
    display: grid;
    grid-template-columns: 44px 1fr 160px;
    align-items: center;
    gap: 24px;
    height: 132px;
    border-bottom: 1px solid rgba(23, 21, 15, 0.22);
    opacity: 0;
    animation: row-in 0.6s ease-out both;
  }
  .row.top { animation-delay: 0.7s; }
  .row.mid { animation-delay: 0.85s; }
  .row.low { animation-delay: 1s; }
  .swatch { width: 40px; height: 40px; }
  .swatch.a { background: #d8452e; }
  .swatch.b { background: #1d1b16; }
  .swatch.c { background: #b6ad97; }
  .label {
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .label small {
    display: block;
    margin-top: 6px;
    font: 400 15px/1.3 "JetBrains Mono", monospace;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(23, 21, 15, 0.7);
  }
  .value {
    font-family: "JetBrains Mono", monospace;
    font-size: 40px;
    text-align: right;
    letter-spacing: -0.02em;
  }
  .row.top .value { color: #d8452e; }
  .badge {
    position: absolute;
    left: 900px;
    top: 300px;
    font: 400 16px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #f2efe6;
    background: #d8452e;
    padding: 12px 18px;
    opacity: 0;
    animation: pop 0.5s ease-out both;
    animation-delay: 1.2s;
  }
  .footnote {
    position: absolute;
    left: 104px;
    bottom: 62px;
    font: 400 17px/1.5 "JetBrains Mono", monospace;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: rgba(23, 21, 15, 0.68);
  }
  @keyframes pie-in {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  @keyframes pop {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes row-in {
    from { transform: translateX(28px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes fade-up {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="pie-chart" data-root="true" data-width="1920" data-height="1080" data-fps="30" data-duration="3.8">
  <div class="kicker" style="animation: fade-up 0.6s ease-out both; animation-delay: 0.08s">Perfil de gasto / 12 meses</div>
  <div class="title" style="animation: fade-up 0.7s ease-out both; animation-delay: 0.15s">De onde vem <em>o minuto</em>.</div>

  <div class="pie-wrap" data-clip-id="pie" data-start="0.25" data-duration="3.55">
    <div class="pie"></div>
    <div class="slice-pop"></div>
    <div class="hole"><b>46%</b><small>maior fatia</small></div>
  </div>

  <div class="badge" data-clip-id="badge" data-start="0.25" data-duration="3.55">Montagem domina</div>

  <div class="legend" data-clip-id="legend" data-start="0.55" data-duration="3.25">
    <div class="row top">
      <span class="swatch a"></span>
      <span class="label">Montagem<small>Sala de corte</small></span>
      <span class="value">46%</span>
    </div>
    <div class="row mid">
      <span class="swatch b"></span>
      <span class="label">Captação<small>Set e deslocamento</small></span>
      <span class="value">31%</span>
    </div>
    <div class="row low">
      <span class="swatch c"></span>
      <span class="label">Acabamento<small>Cor, som e entrega</small></span>
      <span class="value">23%</span>
    </div>
  </div>

  <div class="footnote" style="animation: fade-up 0.6s ease-out both; animation-delay: 1.5s">Base: 128 projetos finalizados · horas faturáveis</div>
</div>
</body>
</html>
