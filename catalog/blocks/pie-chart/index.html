<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>pie-chart</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f2efe6; }
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #f2efe6;
    color: #17150f;
    font-family: "Inter", sans-serif;
  }
  .kicker {
    position: absolute;
    left: 104px;
    top: 88px;
    font: 400 19px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(23, 21, 15, 0.72);
  }
  .title {
    position: absolute;
    left: 100px;
    top: 128px;
    width: 780px;
    font-size: 86px;
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.045em;
  }
  .title em { font-style: normal; color: #d8452e; }
  .pie-wrap {
    position: absolute;
    left: 160px;
    top: 392px;
    width: 560px;
    height: 560px;
  }
  .pie {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(#d8452e 0 46%, #1d1b16 46% 77%, #b6ad97 77% 100%);
  }
  .slice-pop {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(#f0553b 0 46%, transparent 46% 100%);
    transform: translate(26px, -6px);
  }
  .hole {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 320px;
    height: 320px;
    margin: -160px 0 0 -160px;
    border-radius: 50%;
    background: #f2efe6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .hole b {
    font-family: "Anton", sans-serif;
    font-size: 108px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0.01em;
  }
  .hole small {
    margin-top: 10px;
    font: 400 16px/1.2 "JetBrains Mono", monospace;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(23, 21, 15, 0.72);
  }
  .legend {
    position: absolute;
    left: 900px;
    top: 420px;
    width: 900px;
    border-top: 2px solid #17150f;
  }
  .row {
    display: grid;
    grid-template-columns: 44px 1fr 160px;
    align-items: center;
    gap: 24px;
    height: 132px;
    border-bottom: 1px solid rgba(23, 21, 15, 0.22);
  }
  .swatch { width: 40px; height: 40px; }
  .swatch.a { background: #d8452e; }
  .swatch.b { background: #1d1b16; }
  .swatch.c { background: #b6ad97; }
  .label {
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .label small {
    display: block;
    margin-top: 6px;
    font: 400 15px/1.3 "JetBrains Mono", monospace;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(23, 21, 15, 0.7);
  }
  .value {
    font-family: "JetBrains Mono", monospace;
    font-size: 40px;
    text-align: right;
    letter-spacing: -0.02em;
  }
  .row.top .value { color: #d8452e; }
  .badge {
    position: absolute;
    left: 900px;
    top: 300px;
    font: 400 16px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #f2efe6;
    background: #d8452e;
    padding: 12px 18px;
  }
  .footnote {
    position: absolute;
    left: 104px;
    bottom: 62px;
    font: 400 17px/1.5 "JetBrains Mono", monospace;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: rgba(23, 21, 15, 0.68);
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="pie-chart" data-root="true" data-width="1920" data-height="1080" data-fps="30" data-duration="3.8">
  <div class="kicker" data-clip-id="kicker" data-start="0" data-duration="3.8" data-enter="subir distance=20 dur=0.6 at=0.08 curve=ease-out">Perfil de gasto / 12 meses</div>
  <div class="title" data-clip-id="title" data-start="0" data-duration="3.8" data-enter="subir distance=20 dur=0.7 at=0.15 curve=ease-out">De onde vem <em>o minuto</em>.</div>

  <div class="pie-wrap" data-clip-id="pie" data-start="0.25" data-duration="3.55" data-enter="crescer amount=0.9 dur=0.8 curve=cubic-bezier(0.22,0.8,0.2,1)">
    <div class="pie"></div>
    <div class="slice-pop" data-enter="surgir dur=0.5 at=0.9 curve=ease-out"></div>
    <div class="hole"><b>46%</b><small>maior fatia</small></div>
  </div>

  <div class="badge" data-clip-id="badge" data-start="0.25" data-duration="3.55" data-enter="surgir dur=0.5 at=0.95 curve=ease-out">Montagem domina</div>

  <div class="legend" data-clip-id="legend" data-start="0.55" data-duration="3.25">
    <div class="row top" data-enter="chegar-direita distance=28 dur=0.6 at=0.15 curve=ease-out">
      <span class="swatch a"></span>
      <span class="label">Montagem<small>Sala de corte</small></span>
      <span class="value">46%</span>
    </div>
    <div class="row mid" data-enter="chegar-direita distance=28 dur=0.6 at=0.3 curve=ease-out">
      <span class="swatch b"></span>
      <span class="label">Captação<small>Set e deslocamento</small></span>
      <span class="value">31%</span>
    </div>
    <div class="row low" data-enter="chegar-direita distance=28 dur=0.6 at=0.45 curve=ease-out">
      <span class="swatch c"></span>
      <span class="label">Acabamento<small>Cor, som e entrega</small></span>
      <span class="value">23%</span>
    </div>
  </div>

  <div class="footnote" data-clip-id="footnote" data-start="0" data-duration="3.8" data-enter="subir distance=20 dur=0.6 at=1.5 curve=ease-out">Base: 128 projetos finalizados · horas faturáveis</div>
</div>
</body>
</html>
