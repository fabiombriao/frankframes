<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>callout-box</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #ece6d8; }
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #ece6d8;
    color: #151513;
    font-family: "Inter", sans-serif;
  }
  .stage::before {
    content: "";
    position: absolute;
    inset: 40px;
    border: 1px solid rgba(21, 21, 19, 0.18);
  }
  .box {
    position: absolute;
    left: 300px;
    top: 292px;
    width: 1320px;
    height: 500px;
    background: #fffdf6;
    border: 8px solid #151513;
    display: grid;
    grid-template-columns: 260px 1fr;
    align-items: center;
  }
  .box::after {
    content: "";
    position: absolute;
    left: -8px;
    bottom: -8px;
    width: 140px;
    height: 16px;
    background: #d8452e;
  }
  .icon-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    border-right: 2px solid rgba(21, 21, 19, 0.16);
  }
  .tri {
    position: relative;
    width: 132px;
    height: 118px;
    background: #d8452e;
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
  }
  .tri::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 44px;
    width: 11px;
    height: 34px;
    margin-left: -5.5px;
    background: #fffdf6;
    border-radius: 2px;
  }
  .tri::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 20px;
    width: 11px;
    height: 11px;
    margin-left: -5.5px;
    background: #fffdf6;
    border-radius: 50%;
  }
  .content { padding: 0 64px 0 60px; }
  .kicker {
    font: 400 18px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #b02f1c;
  }
  .headline {
    margin-top: 18px;
    font-size: 78px;
    font-weight: 700;
    line-height: 1.06;
    letter-spacing: -0.04em;
  }
  .headline span { display: block; }
  .body {
    margin-top: 26px;
    width: 760px;
    font-size: 24px;
    line-height: 1.5;
    color: #2f2c24;
  }
  .body b { color: #151513; }
  .note {
    position: absolute;
    right: 104px;
    top: 108px;
    font: 400 17px/1.4 "JetBrains Mono", monospace;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-align: right;
    color: rgba(21, 21, 19, 0.68);
  }
  .stamp {
    position: absolute;
    left: 300px;
    top: 210px;
    font-family: "Anton", sans-serif;
    font-size: 40px;
    letter-spacing: 0.06em;
    color: #151513;
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="callout-box" data-root="true" data-width="1920" data-height="1080" data-fps="30" data-duration="3.4">
  <div class="stamp" data-clip-id="stamp" data-start="0.1" data-duration="3.3" data-enter="subir distance=22 dur=0.6 curve=ease-out">NOTA 07</div>
  <div class="note" data-clip-id="note" data-start="0.25" data-duration="3.15" data-enter="surgir dur=0.6 curve=ease-out">Regra de corte<br>vale para toda a série</div>

  <div class="box" data-clip-id="callout" data-start="0.15" data-duration="3.25" data-enter="subir distance=36 dur=0.65 curve=cubic-bezier(0.22,0.8,0.2,1)">
    <div class="icon-cell"><div class="tri" data-enter="crescer amount=0.55 dur=0.5 at=0.35 curve=cubic-bezier(0.22,0.8,0.2,1)"></div></div>
    <div class="content">
      <div class="kicker" data-enter="surgir dur=0.5 at=0.4 curve=ease-out">atenção</div>
      <div class="headline"><span data-enter="subir distance=22 dur=0.6 at=0.29 curve=ease-out">Não é o corte.</span><span data-enter="subir distance=22 dur=0.6 at=0.41 curve=ease-out">É a ordem.</span></div>
      <div class="body" data-enter="surgir dur=0.6 at=0.65 curve=ease-out">Reordenar as cenas resolveu o que <b>três reedições</b> não resolveram: o problema estava na sequência, não no material.</div>
    </div>
  </div>
</div>
</body>
</html>
