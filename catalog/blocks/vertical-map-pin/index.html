<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>vertical-map-pin</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #e8e2d2; }
  .stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #e8e2d2;
    color: #1b1913;
    font-family: "Inter", sans-serif;
  }
  .kicker {
    position: absolute;
    left: 96px;
    top: 120px;
    font: 400 20px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(27, 25, 19, 0.72);
  }
  .title {
    position: absolute;
    left: 92px;
    top: 182px;
    width: 860px;
    font-size: 84px;
    font-weight: 700;
    line-height: 1.03;
    letter-spacing: -0.04em;
  }
  .title span { color: #d8452e; }
  .map {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 560px;
    height: 900px;
    border-top: 1px solid rgba(27, 25, 19, 0.28);
    border-bottom: 1px solid rgba(27, 25, 19, 0.28);
  }
  .ring-shape {
    position: absolute;
    border: 2px solid rgba(27, 25, 19, 0.24);
    border-radius: 50%;
  }
  .ring-shape.a { left: -180px; top: 90px; width: 640px; height: 640px; }
  .ring-shape.b { right: -140px; bottom: 30px; width: 420px; height: 420px; }
  .ring-shape.c { left: 250px; top: 330px; width: 190px; height: 190px; border-color: rgba(27, 25, 19, 0.16); }
  .line {
    position: absolute;
    height: 3px;
    background: rgba(27, 25, 19, 0.22);
  }
  .line.a { left: -300px; top: 250px; width: 1400px; transform: rotate(24deg); }
  .line.b { left: -200px; top: 640px; width: 1200px; transform: rotate(-17deg); }
  .line.c { left: 420px; top: -40px; width: 3px; height: 1000px; transform: rotate(9deg); }
  .block {
    position: absolute;
    border: 2px solid rgba(27, 25, 19, 0.3);
    background: rgba(27, 25, 19, 0.05);
  }
  .block.a { left: 120px; top: 120px; width: 96px; height: 96px; }
  .block.b { right: 150px; top: 220px; width: 130px; height: 70px; }
  .block.c { left: 620px; bottom: 140px; width: 88px; height: 88px; transform: rotate(-8deg); }
  .pin {
    position: absolute;
    left: 540px;
    top: 1010px;
    width: 130px;
    margin-left: -65px;
    z-index: 4;
  }
  .head {
    position: relative;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: #d8452e;
  }
  .head::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 44px;
    height: 44px;
    margin: -22px 0 0 -22px;
    border-radius: 50%;
    background: #e8e2d2;
  }
  .tail {
    width: 48px;
    height: 84px;
    margin: -8px auto 0;
    background: #d8452e;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }
  .pulse {
    position: absolute;
    left: 540px;
    top: 1212px;
    width: 140px;
    height: 38px;
    margin-left: -70px;
    border: 3px solid #d8452e;
    border-radius: 50%;
  }
  .city {
    position: absolute;
    left: 96px;
    top: 1530px;
    display: flex;
    align-items: baseline;
    gap: 24px;
  }
  .city b {
    font-family: "Anton", sans-serif;
    font-size: 120px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0.01em;
    text-transform: uppercase;
  }
  .city span {
    font: 400 20px/1.3 "JetBrains Mono", monospace;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(27, 25, 19, 0.72);
  }
  .coords {
    position: absolute;
    left: 96px;
    top: 1688px;
    width: 800px;
    font: 400 19px/1.6 "JetBrains Mono", monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(27, 25, 19, 0.68);
  }
  .foot {
    position: absolute;
    left: 96px;
    right: 96px;
    bottom: 96px;
    border-top: 2px solid #1b1913;
    padding-top: 22px;
    display: flex;
    justify-content: space-between;
    font: 400 17px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(27, 25, 19, 0.68);
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="vertical-map-pin" data-root="true" data-width="1080" data-height="1920" data-fps="30" data-duration="3.8">
  <div class="kicker" data-clip-id="kicker" data-start="0" data-duration="3.8" data-enter="surgir dur=0.6 at=0.08 curve=ease-out">Mapa / ponto 03</div>
  <div class="title" data-clip-id="title" data-start="0" data-duration="3.8" data-enter="subir distance=24 dur=0.7 at=0.15 curve=ease-out">Onde tudo <span>acontece.</span></div>

  <div class="map" data-clip-id="map" data-start="0.1" data-duration="3.7">
    <div class="ring-shape a"></div>
    <div class="ring-shape b"></div>
    <div class="ring-shape c"></div>
    <div class="line a"></div>
    <div class="line b"></div>
    <div class="line c"></div>
    <div class="block a"></div>
    <div class="block b"></div>
    <div class="block c"></div>
  </div>

  <div class="pin" data-clip-id="map-pin" data-start="0.4" data-duration="3.4" data-keyframes='[{"time":0,"y":-280,"opacity":0,"curve":"cubic-bezier(0.34,1.24,0.5,1)"},{"time":0.8,"y":0,"opacity":1}]'>
    <div class="head"></div>
    <div class="tail"></div>
  </div>
  <div class="pulse" data-clip-id="pin-pulse" data-start="0.95" data-duration="1.2" data-keyframes='[{"time":0,"scale":0.4,"opacity":0.85,"curve":"cubic-bezier(0,0,0.58,1)"},{"time":1.2,"scale":1.9,"opacity":0}]'></div>
  <div class="pulse two" data-clip-id="pin-pulse-two" data-start="1.2" data-duration="1.2" data-keyframes='[{"time":0,"scale":0.4,"opacity":0.85,"curve":"cubic-bezier(0,0,0.58,1)"},{"time":1.2,"scale":1.9,"opacity":0}]'></div>

  <div class="city" data-clip-id="city" data-start="0" data-duration="3.8" data-enter="subir distance=24 dur=0.6 at=1.05 curve=ease-out">
    <b>Lisboa</b><span>38.72° N<br>9.14° O</span>
  </div>
  <div class="coords" data-clip-id="coords" data-start="0" data-duration="3.8" data-enter="surgir dur=0.6 at=1.2 curve=ease-out">Sede do estúdio · gravações entre Alfama e o Cais do Sodré</div>

  <div class="foot" data-clip-id="foot" data-start="0" data-duration="3.8" data-enter="surgir dur=0.6 at=1.35 curve=ease-out">
    <span>Escala 1:25 000</span><span>FIG. 03</span>
  </div>
</div>
</body>
</html>
