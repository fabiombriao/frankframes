<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>chapter-transition</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #bd3b25; }
  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #bd3b25;
    color: #f5efe0;
    font-family: "Inter", sans-serif;
  }
  .number {
    position: absolute;
    left: 104px;
    top: 96px;
    font-family: "Anton", sans-serif;
    font-size: 820px;
    line-height: 0.86;
    letter-spacing: -0.03em;
    color: #f5efe0;
  }
  .rule {
    position: absolute;
    left: 126px;
    top: 884px;
    width: 980px;
    height: 6px;
    background: #f2e34c;
    transform-origin: left center;
  }
  .label {
    position: absolute;
    left: 126px;
    top: 922px;
    display: flex;
    align-items: baseline;
    gap: 24px;
    font: 400 22px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.24em;
    text-transform: uppercase;
  }
  .label em {
    font-family: "Inter", sans-serif;
    font-style: normal;
    font-weight: 600;
    font-size: 34px;
    letter-spacing: 0.02em;
    text-transform: none;
  }
  .side {
    position: absolute;
    right: 118px;
    top: 128px;
    writing-mode: vertical-rl;
    font: 400 20px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(245, 239, 224, 0.6);
  }
  .tick {
    position: absolute;
    right: 118px;
    bottom: 96px;
    width: 220px;
    height: 2px;
    background: rgba(245, 239, 224, 0.45);
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="chapter-transition" data-root="true" data-width="1920" data-height="1080" data-fps="30" data-duration="3.2">
  <div class="number" data-clip-id="chapter-number" data-start="0" data-duration="3.2" data-enter="chegar-esquerda distance=520 dur=0.64 curve=cubic-bezier(0.2,0.86,0.24,1)" data-exit="partir-esquerda distance=120 dur=0.96 curve=cubic-bezier(0.2,0.86,0.24,1)">04</div>
  <div class="rule" data-clip-id="chapter-rule" data-start="0.15" data-duration="3.05" data-keyframes='[{"time":0,"scaleX":0,"curve":"cubic-bezier(0.2,0.86,0.24,1)"},{"time":1,"scaleX":1}]'></div>
  <div class="label" data-clip-id="chapter-label" data-start="0.3" data-duration="2.9" data-enter="subir distance=22 dur=0.58 curve=ease-out" data-exit="apagar dur=0.638 curve=ease-out">
    Capítulo quatro <em>A cidade que acorda</em>
  </div>
  <div class="side" data-clip-id="chapter-side" data-start="0.5" data-duration="2.7" data-enter="descer distance=18 dur=0.9 curve=ease-out">Temporada 02</div>
  <div class="tick" data-clip-id="chapter-tick" data-start="0.6" data-duration="2.6"></div>
</div>
</body>
</html>
