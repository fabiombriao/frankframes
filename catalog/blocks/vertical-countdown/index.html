<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>vertical-countdown</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0f1012; }
  .stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #0f1012;
    color: #f3efe4;
    font-family: "Inter", sans-serif;
  }
  .top {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 104px;
    display: flex;
    justify-content: space-between;
    font: 400 21px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(243, 239, 228, 0.5);
    animation: fade-in 0.6s ease-out both;
  }
  .top b { color: #f2e34c; font-weight: 400; }
  .beat {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .ring {
    position: absolute;
    width: 840px;
    height: 840px;
    border: 2px solid rgba(243, 239, 228, 0.16);
    border-radius: 50%;
  }
  .ring::before {
    content: "";
    position: absolute;
    inset: 44px;
    border: 1px solid rgba(243, 239, 228, 0.1);
    border-radius: 50%;
  }
  .ring::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -11px;
    width: 20px;
    height: 20px;
    margin-left: -10px;
    background: #f2e34c;
    border-radius: 50%;
  }
  .digit {
    position: relative;
    font-family: "Anton", sans-serif;
    font-size: 780px;
    line-height: 0.9;
    letter-spacing: -0.03em;
    animation: pulse 1s cubic-bezier(0.22, 0.85, 0.24, 1) both;
  }
  .caption {
    position: absolute;
    left: 0;
    right: 0;
    top: 1300px;
    text-align: center;
    font: 400 24px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(243, 239, 228, 0.6);
  }
  .tracker {
    position: absolute;
    left: 96px;
    right: 96px;
    bottom: 220px;
    display: flex;
    gap: 16px;
  }
  .tracker span {
    flex: 1;
    height: 6px;
    background: rgba(243, 239, 228, 0.16);
    animation: fill 0.2s linear both;
  }
  .tracker span:nth-child(2) { animation-delay: 1s; }
  .tracker span:nth-child(3) { animation-delay: 2s; }
  .foot {
    position: absolute;
    left: 96px;
    right: 96px;
    bottom: 112px;
    display: flex;
    justify-content: space-between;
    font: 400 19px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(243, 239, 228, 0.42);
  }
  @keyframes pulse {
    0% { opacity: 0; transform: scale(1.14); }
    26% { opacity: 1; transform: scale(1); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes fill {
    from { background: rgba(243, 239, 228, 0.16); }
    to { background: #f2e34c; }
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="vertical-countdown" data-root="true" data-width="1080" data-height="1920" data-fps="30" data-duration="3">
  <div class="top" data-clip-id="vcount-top" data-start="0" data-duration="3">
    <span><b>●</b> Contagem</span>
    <span>Estúdio · 30 fps</span>
  </div>

  <div class="beat" data-clip-id="vcount-three" data-start="0" data-duration="1">
    <div class="ring"></div>
    <div class="digit">3</div>
    <div class="caption">Prepara a câmera</div>
  </div>

  <div class="beat" data-clip-id="vcount-two" data-start="vcount-three" data-duration="1">
    <div class="ring"></div>
    <div class="digit">2</div>
    <div class="caption">Ajusta a luz</div>
  </div>

  <div class="beat" data-clip-id="vcount-one" data-start="vcount-two" data-duration="1">
    <div class="ring"></div>
    <div class="digit">1</div>
    <div class="caption">Silêncio no set</div>
  </div>

  <div class="tracker" data-clip-id="vcount-tracker" data-start="0" data-duration="3">
    <span></span><span></span><span></span>
  </div>

  <div class="foot" data-clip-id="vcount-foot" data-start="0" data-duration="3">
    <span>Formato 9:16</span>
    <span>00:03</span>
  </div>
</div>
</body>
</html>
