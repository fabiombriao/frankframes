<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>vertical-captions</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0e1012; }
  .stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #0e1012;
    color: #f2efe6;
    font-family: "Inter", sans-serif;
  }
  .kicker {
    position: absolute;
    left: 96px;
    top: 112px;
    display: flex;
    align-items: center;
    gap: 14px;
    font: 400 22px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(242, 239, 230, 0.5);
  }
  .kicker .rec {
    width: 12px;
    height: 12px;
    background: #c8412a;
    border-radius: 50%;
  }
  .safe {
    position: absolute;
    left: 96px;
    right: 96px;
    bottom: 96px;
    height: 1px;
    background: rgba(242, 239, 230, 0.22);
  }
  .safe::before,
  .safe::after {
    content: "";
    position: absolute;
    bottom: 0;
    width: 1px;
    height: 34px;
    background: rgba(242, 239, 230, 0.22);
  }
  .safe::before { left: 0; }
  .safe::after { right: 0; }
  .caps {
    position: absolute;
    left: 96px;
    right: 96px;
    bottom: 300px;
  }
  .line {
    display: flex;
    gap: 26px;
    padding: 28px 0 24px;
    border-top: 1px solid rgba(242, 239, 230, 0.16);
    animation: cap-in 0.7s cubic-bezier(0.22, 0.85, 0.24, 1) both;
  }
  .line:nth-child(1) { animation-delay: 0.15s; }
  .line:nth-child(2) { animation-delay: 0.6s; }
  .line:nth-child(3) { animation-delay: 1.05s; border-bottom: 1px solid rgba(242, 239, 230, 0.16); }
  .line .who {
    flex: 0 0 104px;
    padding-top: 10px;
    font: 400 22px/1.2 "JetBrains Mono", monospace;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #f2e34c;
  }
  .line .who span {
    display: block;
    margin-top: 8px;
    color: rgba(242, 239, 230, 0.5);
    font-size: 17px;
  }
  .line .say {
    font-size: 49px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: -0.025em;
  }
  .line .say em {
    font-style: normal;
    color: #f2e34c;
  }
  .note {
    position: absolute;
    left: 96px;
    right: 96px;
    bottom: 168px;
    display: flex;
    justify-content: space-between;
    font: 400 19px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(242, 239, 230, 0.38);
  }
  @keyframes cap-in {
    from { opacity: 0; transform: translateY(34px); clip-path: inset(0 0 100% 0); }
    to { opacity: 1; transform: translateY(0); clip-path: inset(0 0 -12% 0); }
  }
</style>
</head>
<body>
<div class="stage" data-composition-id="vertical-captions" data-root="true" data-width="1080" data-height="1920" data-fps="30" data-duration="3.6">
  <div class="kicker" data-clip-id="captions-kicker" data-start="0" data-duration="3.6" data-enter="descer distance=10 dur=0.6 curve=ease-out">
    <span class="rec"></span>Legendas · entrevista
  </div>

  <div class="caps" data-clip-id="captions-stack" data-start="0" data-duration="3.6">
    <div class="line">
      <div class="who">Ana<span>00:12</span></div>
      <div class="say">A gente chegou antes do sol e ficou até a última <em>luz</em>.</div>
    </div>
    <div class="line">
      <div class="who">Ruy<span>00:18</span></div>
      <div class="say">Ninguém sabia se o caminho ia dar em algum lugar.</div>
    </div>
    <div class="line">
      <div class="who">Ana<span>00:24</span></div>
      <div class="say">Deu. E a câmera estava <em>ligada</em>.</div>
    </div>
  </div>

  <div class="note" data-clip-id="captions-note" data-start="1.4" data-duration="2.2" data-enter="descer distance=10 dur=0.7 at=0.1 curve=ease-out">
    <span>Margem segura · 96 px</span>
    <span>Auto · pt-BR</span>
  </div>

  <div class="safe" data-clip-id="captions-safe" data-start="0.2" data-duration="3.4" data-enter="descer distance=10 dur=0.8 curve=ease-out"></div>
</div>
</body>
</html>
